# dso-config.reference.conf — DSO plugin reference configuration
#
# This file defines the canonical set of DSO configuration keys with their
# default values. It is used by dso-setup.sh during install and update to
# merge new keys into the host project's .claude/dso-config.conf.
#
# Strategy: key-additive merge. Keys already present in the host config
# (active or commented out) are never overwritten. Only missing keys are appended.
#
# Format: KEY=VALUE (dot-notation for nesting)
#
version=1.1.0
# dso.plugin_root is always set by dso-setup.sh directly — listed here for reference only.
# dso.plugin_root=

# --- Workflow mode (canonical key) ---
# dso.workflow controls merge strategy and enforcement as a single opinionated setting.
#   ci-pr  — PRs required; CI enforces review gate; merge-to-main routes through merge-to-main-pr.sh
#   local  — Direct merges allowed; review gate enforced locally; merge-to-main routes through merge-to-main-direct.sh
# dso.workflow=local

# --- Legacy workflow keys (DEPRECATED — use dso.workflow instead) ---
# merge.strategy and enforcement.strategy are derived from dso.workflow when dso.workflow is set.
# Set them only if you need to override individual dimensions independently.
# merge.strategy=direct          # DEPRECATED: prefer dso.workflow=local or dso.workflow=ci-pr
# enforcement.strategy=local     # DEPRECATED: prefer dso.workflow=local or dso.workflow=ci-pr
# worktree.isolation_enabled     # DEPRECATED: isolation is always enabled; this key has no effect
# attribution.enabled            # DEPRECATED: attribution is always enabled; this key has no effect

# --- Model tier configuration ---
model.haiku=claude-haiku-4-5
model.sonnet=claude-sonnet-4-6
model.opus=claude-opus-4-7

# --- CI provider-agnostic model configuration ---
model.provider=anthropic
model.light=claude-haiku-4-5
model.standard=claude-sonnet-4-6
model.deep=claude-opus-4-7
# OpenAI defaults: model.light=gpt-5.4-nano, model.standard=gpt-5.4, model.deep=gpt-5.5

# --- Worktree lifecycle ---
# worktree.isolation_enabled=true  # DEPRECATED: isolation is always enabled; use dso.workflow instead

# --- Test gate configuration ---
test_quality.tool=bash-grep
test_quality.enabled=true
test_gate.centrality_threshold=999999

# --- Sprint configuration ---
brainstorm.enforce_entry_gate=true
sprint.max_replan_cycles=2
implementation_plan.approach_resolution=autonomous

# --- Review configuration ---
# review.max_cycles=4
# Maximum schema-correction re-dispatch attempts (default: 1, range: 0-3, ceiling: 3).
# 0 disables correction; values above 3 are clamped to 3 with a warning.
# review.schema_correction_max_attempts=1

# --- Scope drift reviewer ---
scope_drift.enabled=true

# --- Ruleset / branch-protection bypass actor (Goal-4 containment) ---
# ruleset.bypass_user_id: GitHub numeric user ID permitted to bypass required
# checks via the web-UI "Merge without waiting" button (the human override).
# When set, provision-ruleset.sh emits {actor_type:User, actor_id:<id>,
# bypass_mode:pull_request} on both rulesets instead of RepositoryRole:admin —
# so the admin *role* can no longer bypass; only this named human can (a local
# LLM dev agent under a non-admin token cannot bypass by any path). The
# ruleset-design-invariants check (tests/scripts/test-ruleset-design-invariants.sh)
# drift-locks the live bypass actor to this configured ID. Env override:
# DSO_RULESET_BYPASS_USER_ID. Resolve via `gh api users/<login> --jq .id`.
# ruleset.bypass_user_id=
#
# ruleset.bypass_user_ids: OPTIONAL comma-separated SET of numeric GitHub user IDs
# treated as designated bypass-actors for IDENTITY-BASED admin exemption (ADR-0022).
# A SHA whose covering merged PR was merged by any of these IDs (server-set
# merged_by) is reviewed-equivalent in the coverage + provenance gates — this is how
# an admin web-UI FP-recovery override propagates with NO signing key and NO second
# override. Each element must be numeric (malformed tokens are discarded). When
# unset, falls back to the single ruleset.bypass_user_id (back-compat). Use the set
# for multi-maintainer teams. Env override: DSO_RULESET_BYPASS_USER_IDS.
# ruleset.bypass_user_ids=

# --- Suggestion capture thresholds ---
suggestion.error_threshold=10
suggestion.timeout_threshold=3

# --- Debug configuration ---
debug.max_fix_validate_cycles=3
debug.intent_search_budget=20

# --- Ticket system ---
# tickets.prefix=myproject
# tickets.directory=.tickets-tracker

# --- Monitoring ---
monitoring.tool_errors=true

# --- Clarity check ---
clarity_check.pass_threshold=5
