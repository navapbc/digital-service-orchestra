# UI Reference Corpus Index
# This file is the manifest for all corpus entries in the ui-reference/ directory.
# Each entry maps a file path to its metadata for tooling (ref-query, schema checks).
#
# Format:
#   path:     Relative path from this _index.yaml file
#   id:       Unique entry ID (matches 'id' field in the YAML file)
#   tags:     List of searchable tags
#   summary:  One-line description for quick reference

entries:
  # ── components/uswds ────────────────────────────────────────────────────────

  - path: components/uswds-form-components.yaml
