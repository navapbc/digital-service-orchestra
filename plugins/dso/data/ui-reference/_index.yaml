      - plain-language
      - WCAG-2.1-AA
      - Section-508
      - OMB-A11-280
    severity:
      - major
    story_type:
      - pattern
    coverage:
      - summary
  - file_path: gov-benefit-flows/confirmation-e-signature.yaml
    id: "gov-benefit-flows-confirmation-e-signature"
    title: "Confirmation Page and E-Signature Patterns for Benefit Application Submission"
    source: "GOV.UK Design System confirmation pages; USWDS; E-Sign Act (15 U.S.C. § 7001)"
    license: "public-domain"
    summary: "The confirmation page and e-signature pattern closes the benefit application
flow with a clear legal signature mechanism and a confirmation page that
establishes trust and sets expectations. E-signature for government benefit
applications must meet the E-Sign Act (15 U.S.C. § 7001) and applicable
state law requirements. The confirmation page must provide the applicant's
reference number, a summary of what was submitted, what happens next,
and how to follow up if they do not hear back within the stated timeframe.
"
    rule_id: "GOV-BENEFIT-010"
    prior_art: "https://design-system.service.gov.uk/patterns/confirmation-pages/"
