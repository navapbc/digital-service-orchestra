      - pattern
    coverage:
      - summary
  - file_path: gov-benefit-flows/draft-resume-application.yaml
    id: "gov-benefit-flows-draft-resume"
    title: "Draft and Resume Application Patterns for Government Benefit Forms"
    source: "GOV.UK Service Manual; USDS Benefit Application Research; Nava PBC Benefits Delivery Research"
    license: "public-domain"
    summary: "Draft and resume patterns allow applicants to save an incomplete benefit
application and return to complete it later, without requiring account
creation. This is critical for benefit applications because applicants
often need to gather documents (pay stubs, ID, rent receipts) mid-way
through the form. The save-and-return mechanism must be accessible to
users without email addresses, smartphones, or stable internet, and must
not expire the draft within a period shorter than what is reasonable for
document gathering.
"
    rule_id: "GOV-BENEFIT-011"
    prior_art: "https://design-system.service.gov.uk/patterns/save-progress/"
    precedence: "2"
    domain:
      - gov-benefit-flows
    action:
      - design
      - apply
      - implement
    compliance:
      - 21st-Century-IDEA
      - plain-language
      - WCAG-2.1-AA
    severity:
      - major
    story_type:
      - pattern
    coverage:
      - summary
  - file_path: gov-benefit-flows/multi-step-task-list.yaml
    id: "gov-benefit-flows-multi-step-task-list"
    title: "Multi-Step Task List Pattern for Long Government Benefit Applications"
    source: "GOV.UK Design System task list component (design-system.service.gov.uk); VA.gov Veteran-Facing Services Pattern Library"
    license: "public-domain"
    summary: "The multi-step task list presents a benefit application as a named list of
sections (tasks), each with an explicit status (Not started, In progress,
Completed, Cannot start yet). Applicants can complete sections in any order
(except when dependencies require sequencing), save and return at any time,
and see at a glance how much of the application remains. This pattern is
essential for long-form applications such as SNAP, SSI, Medicaid, and
unemployment insurance where applicants must gather documents before
answering certain sections.
"
    rule_id: "GOV-BENEFIT-004"
    prior_art: "https://design-system.service.gov.uk/patterns/task-list-pages/"
    precedence: "1"
    domain:
      - gov-benefit-flows
    action:
      - design
      - apply
      - implement
    compliance:
      - 21st-Century-IDEA
      - plain-language
      - WCAG-2.1-AA
      - Section-508
    severity:
      - critical
    story_type:
      - pattern
    coverage:
      - summary
  - file_path: gov-benefit-flows/one-question-per-page-repeatable-items.yaml
    id: "gov-benefit-flows-repeatable-items"
    title: "One Question Per Page: Repeatable Items Pattern for Household Members and Income Sources"
    source: "GOV.UK Service Manual (service-manual.service.gov.uk/design/lists); 18F Forms Guidance"
    license: "public-domain"
    summary: "The repeatable items pattern enables applicants to add multiple entities
(household members, income sources, addresses) within a one-question-per-page
flow. Each entity is collected through its own mini-loop of screens before
returning to an add/remove list. This avoids table-based data entry and
handles dynamic household composition naturally for benefit applications
such as SNAP, Medicaid, and housing assistance.
"
    rule_id: "GOV-BENEFIT-002"
    prior_art: "https://design-system.service.gov.uk/patterns/add-another/"
    precedence: "2"
    domain:
      - gov-benefit-flows
    action:
