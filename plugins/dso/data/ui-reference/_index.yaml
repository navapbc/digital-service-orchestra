  - file_path: patterns/agentic-human-in-loop.yaml
    id: "agentic-human-in-loop-pattern"
    title: "Human-in-the-Loop Interaction Patterns for AI Government Caseworker Tools"
    source: "NIST AI RMF (NIST AI 100-1); Executive Order 14110 on Safe and Trustworthy AI; USDS AI Strategy 2023"
    license: "public-domain"
    summary: "Human-in-the-loop (HITL) interaction patterns define when and how an AI
agent must pause its autonomous operation and request explicit human review
before proceeding. In government caseworker tools, HITL gates are mandatory
for high-stakes, irreversible, or low-confidence decisions. Clear handoff
UI prevents caseworkers from either over-trusting or under-utilizing AI
assistance, and ensures accountability remains with human decision-makers.
"
    domain:
      - patterns
    action:
      - apply
      - design
    compliance:
      - plain-language
      - 21st-Century-IDEA
      - OMB-A11-280
