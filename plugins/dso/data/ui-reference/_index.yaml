  - file_path: gov-benefit-flows/validation-error-messages.yaml
    id: "gov-benefit-flows-validation-errors"
    title: "Validation and Error Messages for Government Benefit Application Forms"
    source: "GOV.UK Design System error messages pattern; 18F Content Guide; USWDS Form Validation"
    license: "public-domain"
    summary: "Validation and error message patterns for benefit application forms must
be forgiving, specific, and non-punitive. Applicants are often under
stress, have low digital literacy, or are using mobile devices. Error
messages must tell users exactly what went wrong and how to fix it,
preserve the data they entered, never clear fields on error, and position
messages adjacent to the failing field as well as in a summary at the
top of the page for screen reader accessibility.
"
    rule_id: "GOV-BENEFIT-006"
    prior_art: "https://design-system.service.gov.uk/components/error-message/"
