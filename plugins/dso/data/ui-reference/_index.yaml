entries:
  - file_path: accessibility/keyboard-navigation-wcag22.yaml
    id: "wcag-keyboard-navigation"
    title: "WCAG 2.2 Keyboard Navigation: Complete Keyboard Accessibility Patterns for Government Services"
    source: "w3c/wcag"
    license: "W3C-Document"
    summary: "This entry consolidates all WCAG 2.2 keyboard navigation success criteria at
AA and AAA levels, with Section 508 and OMB M-24-08 cross-references. Keyboard
accessibility is foundational to Section 508 compliance: all government digital
services must be fully operable without a mouse.

Key WCAG 2.2 additions to keyboard accessibility (new in 2.2 vs 2.1):
- SC 2.4.11 Focus Not Obscured Minimum (AA)
- SC 2.4.12 Focus Not Obscured Enhanced (AAA)
- SC 2.4.13 Focus Appearance (AAA)
- SC 2.5.7 Dragging Movements (AA)
- SC 2.5.8 Target Size Minimum (AA)
"
    rule_id: "wcag-keyboard-navigation"
    prior_art: "https://www.w3.org/TR/WCAG22/#keyboard-accessible"
    precedence: "1"
    domain:
      - accessibility
    component:
    action:
      - verify
      - implement
      - keyboard-nav
      - focus-management
    compliance:
      - wcag-2.2-aaa
      - section-508
    severity:
      - critical
    story_type:
      - compliance-check
    coverage:
      - detail
  - file_path: accessibility/wcag-operable.yaml
    id: "wcag-operable"
    title: "WCAG 2.2 Operable: User Interface Components and Navigation Must Be Operable"
    source: "w3c/wcag"
    license: "W3C-Document"
    summary: "WCAG 2.2 Principle 2 (Operable) requires that all UI components and navigation
be operable by all users, including those who rely exclusively on keyboard input,
switch access, or other non-pointer input methods. This principle is especially
critical for government benefit applications where mouse use cannot be assumed.

Section 508 1194.22(a)-(p) requires full keyboard accessibility for web
applications. OMB M-24-08 calls out keyboard navigation compliance as a
prerequisite for any federally-mandated benefit enrollment workflow.

WCAG 2.2 adds SC 2.4.11 (Focus Not Obscured Minimum AA), SC 2.4.12 (Focus
Not Obscured Enhanced AAA), SC 2.4.13 (Focus Appearance AAA), and
SC 2.5.7 (Dragging Movements AA), SC 2.5.8 (Target Size Minimum AA)
as new requirements relative to WCAG 2.1.
"
    rule_id: "wcag-operable"
    prior_art: "https://www.w3.org/TR/WCAG22/#operable"
    precedence: "1"
    domain:
      - accessibility
    component:
    action:
      - verify
      - implement
      - keyboard-nav
      - focus-management
    compliance:
      - wcag-2.2-aaa
      - section-508
    severity:
      - critical
    story_type:
      - compliance-check
    coverage:
      - detail
  - file_path: accessibility/wcag-perceivable.yaml
    id: "wcag-perceivable"
    title: "WCAG 2.2 Perceivable: Information and UI Components Must Be Presentable to Users"
    source: "w3c/wcag"
    license: "W3C-Document"
    summary: "WCAG 2.2 Principle 1 (Perceivable) requires that all information and user
interface components be presentable to users in ways they can perceive. For
federal government digital services, this means providing text alternatives
for non-text content, captions for time-based media, and content that can be
presented in different ways without losing information or structure.

Section 508 (36 CFR Part 1194) incorporates WCAG 2.0 Level AA by reference
for web content. OMB M-24-08 explicitly requires agencies to meet WCAG 2.1
Level AA at minimum, with AAA-level criteria strongly encouraged for benefit
enrollment and eligibility services accessed by people with disabilities.
"
    rule_id: "wcag-perceivable"
    prior_art: "https://www.w3.org/TR/WCAG22/#perceivable"
    precedence: "1"
    domain:
      - accessibility
    component:
    action:
      - verify
      - implement
      - text-alternatives
      - color-contrast
    compliance:
      - wcag-2.2-aaa
      - section-508
    severity:
      - critical
    story_type:
      - compliance-check
    coverage:
      - detail
  - file_path: accessibility/wcag-robust.yaml
    id: "wcag-robust"
    title: "WCAG 2.2 Robust: Content Must Be Robust Enough for Interpretation by Assistive Technologies"
    source: "w3c/wcag"
    license: "W3C-Document"
    summary: "WCAG 2.2 Principle 4 (Robust) requires that content be robust enough to be
reliably interpreted by a wide variety of user agents, including assistive
technologies such as screen readers (JAWS, NVDA, VoiceOver), voice control
software (Dragon NaturallySpeaking), and switch access devices.

Government digital services must use valid semantic HTML and ARIA to ensure
compatibility with the full range of assistive technologies used by the public,
including veterans, seniors, and people with disabilities who interact with
federal benefit portals.

Section 508 1194.22(d) requires sufficient information about UI elements for
assistive technology. OMB M-24-08 mandates testing with JAWS+Chrome, NVDA+Firefox,
and VoiceOver+Safari for all new agency web applications.
"
    rule_id: "wcag-robust"
    prior_art: "https://www.w3.org/TR/WCAG22/#robust"
    precedence: "1"
    domain:
      - accessibility
    component:
    action:
      - verify
      - implement
    compliance:
      - wcag-2.2-aaa
      - section-508
    severity:
      - critical
    story_type:
      - compliance-check
    coverage:
      - detail
  - file_path: accessibility/wcag-understandable.yaml
    id: "wcag-understandable"
    title: "WCAG 2.2 Understandable: Information and Operation Must Be Understandable"
    source: "w3c/wcag"
    license: "W3C-Document"
    summary: "WCAG 2.2 Principle 3 (Understandable) requires that information and user
interface operation be understandable -- readable, predictable, and providing
input assistance. Government benefit applications must be understandable by
users with cognitive disabilities, limited English proficiency, and varying
digital literacy levels.

OMB M-24-08 Equitable Delivery section explicitly requires that benefit
portals provide plain language, clear error messages, and accessible help
text. Section 508 1194.22 covers form labeling and error identification.
"
    rule_id: "wcag-understandable"
    prior_art: "https://www.w3.org/TR/WCAG22/#understandable"
    precedence: "1"
