      - pattern
    coverage:
      - detail
  - file_path: patterns/agentic-intervention-controls.yaml
    id: "agentic-intervention-controls-pattern"
    title: "Persistent Intervention Controls: User Overrides for AI Agent Behavior"
    source: "Executive Order 14058 on Transforming Federal Customer Experience; USDS Digital Service Playbook; NIST AI RMF"
    license: "public-domain"
    summary: "Persistent intervention controls give users and caseworkers the ability to
pause, override, or redirect an AI agent at any point during its operation.
These controls must be always-visible, clearly labeled, and immediately
effective — not buried in settings menus or disabled during agent runs.
Government AI tools without persistent intervention controls violate user
autonomy and create accountability gaps when agents make errors.
"
    domain:
      - patterns
    action:
      - apply
      - design
      - verify
    compliance:
      - plain-language
      - 21st-Century-IDEA
      - EO-14058
    severity:
