    compliance:
      - 21st-Century-IDEA
      - plain-language
      - WCAG-2.1-AA
    severity:
      - major
    story_type:
      - pattern
    coverage:
      - summary
  - file_path: gov-benefit-flows/one-question-per-page-stacking.yaml
    id: "gov-benefit-flows-stacking-looping"
    title: "One Question Per Page: Stacking and Looping Sub-patterns for Conditional Benefit Flows"
    source: "GOV.UK Service Manual; USDS Benefit Application Research (usds.gov); 18F Engineering Guides"
    license: "public-domain"
    summary: "Stacking and looping are two structural sub-patterns that extend the
one-question-per-page template for complex government benefit flows.
Stacking presents dependent follow-up questions immediately after a
conditional answer within the same page sequence. Looping repeats a
page sequence for each item in a collection (e.g., each income source
per household member). Both patterns preserve the single-question-per-screen
discipline while handling the branching complexity of eligibility rules.
"
    rule_id: "GOV-BENEFIT-003"
    prior_art: "https://service-manual.nhs.uk/design-system/patterns/question-pages"
    precedence: "3"
    domain:
      - gov-benefit-flows
    action:
      - design
      - apply
    compliance:
      - 21st-Century-IDEA
      - plain-language
    severity:
      - major
    story_type:
      - pattern
    coverage:
      - summary
  - file_path: gov-benefit-flows/one-question-per-page-template.yaml
    id: "gov-benefit-flows-one-question-per-page"
    title: "One Question Per Page: Core Template for Government Benefit Application Forms"
    source: "GOV.UK Service Manual (service-manual.service.gov.uk/design); 18F Design Guides"
    license: "public-domain"
    summary: "The one-question-per-page pattern presents a single question or decision
on each screen of a multi-step benefit application. This reduces cognitive
load, prevents intimidating all-in-one forms, and allows conditional routing
without exposing irrelevant fields. Government benefit applications using
this pattern show significantly higher completion rates among applicants
under stress, those with low digital literacy, and mobile device users.
Required fields: one primary label, hint text where needed, inline error
messages, and clear next/back navigation.
"
    rule_id: "GOV-BENEFIT-001"
    prior_art: "https://design-system.service.gov.uk/patterns/question-pages/"
    precedence: "1"
    domain:
      - gov-benefit-flows
    action:
      - design
      - apply
      - implement
    compliance:
      - 21st-Century-IDEA
      - plain-language
      - WCAG-2.1-AA
      - Section-508
    severity:
      - critical
    story_type:
      - pattern
    coverage:
      - summary
  - file_path: gov-benefit-flows/review-page-patterns.yaml
    id: "gov-benefit-flows-review-page"
    title: "Review Page Patterns: Check Your Answers Before Submitting a Benefit Application"
    source: "GOV.UK Design System (design-system.service.gov.uk/patterns/check-answers); USWDS Form Patterns"
    license: "public-domain"
    summary: "The review page presents all of the applicant's answers in a structured
summary before final submission, with inline change links for each answer.
For government benefit applications, this page serves as the last opportunity
to catch errors before a legal submission, reducing processing delays caused
by incorrect or incomplete information. The review page must display all
sections in a consistent format and confirm the applicant understands the
legal declaration attached to the submit action.
"
    rule_id: "GOV-BENEFIT-005"
    prior_art: "https://design-system.service.gov.uk/patterns/check-answers/"
    precedence: "1"
    domain:
      - gov-benefit-flows
