  - file_path: patterns/agentic-progressive-disclosure.yaml
    id: "agentic-progressive-disclosure-pattern"
    title: "Progressive Disclosure of AI Agent Capabilities in Government Service Interfaces"
    source: "Nielsen Norman Group: Progressive Disclosure; USWDS Design System; 18F UX Guide"
    license: "public-domain"
    summary: "Progressive disclosure for AI agents means revealing capabilities, actions,
and complexity incrementally — showing only what the user needs at each step
and expanding detail on demand. In government caseworker tools, this prevents
cognitive overload when introducing AI assistance, builds user trust through
graduated exposure to agent capabilities, and ensures caseworkers are never
surprised by agent scope they did not expect.
"
    domain:
      - patterns
    action:
      - apply
      - design
    compliance:
      - plain-language
      - 21st-Century-IDEA
      - EO-14058
    severity:
      - major
    story_type:
      - pattern
    coverage:
      - detail
  - file_path: patterns/agentic-transparency.yaml
    id: "agentic-transparency-pattern"
    title: "Multi-Level Transparency for AI Agent Actions in Government Services"
    source: "USDS Digital Service Playbook; NIST AI RMF (NIST AI 100-1); GOV.UK AI Transparency Standards"
    license: "public-domain"
    summary: "Multi-level transparency gives users clear, plain-language visibility into
what an AI agent is doing, why it is doing it, and how confident it is.
Government AI caseworker tools must communicate uncertainty and reasoning at
three tiers: status indicators (what is happening now), tool call logs (what
steps the agent took), and data source labels (which information was used).
Omitting transparency at any tier erodes trust and prevents error correction.
"
    domain:
      - patterns
    action:
