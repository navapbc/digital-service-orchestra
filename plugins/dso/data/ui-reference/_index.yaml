  - file_path: gov-benefit-flows/claim-application-status-page.yaml
    id: "gov-benefit-flows-claim-status"
    title: "Claim and Application Status Page Patterns for Government Benefit Services"
    source: "USWDS Benefit Status Patterns; VA.gov Claim Status Tool; 18F Service Design Guides"
    license: "public-domain"
    summary: "Status pages show applicants the current state of their benefit application
or claim, what actions (if any) are required from them, and what to expect
next. Effective status pages reduce call center burden by proactively
surfacing the information applicants most commonly call to ask about:
current status, required documents, and expected decision dates. Status
pages must use plain-language status labels (not codes), actionable
next steps, and contact information when applicants need human help.
"
    rule_id: "GOV-BENEFIT-007"
    prior_art: "https://design.va.gov/patterns/help-users-to/check-answers"
    precedence: "1"
    domain:
