    id: "agentic-error-recovery-pattern"
    title: "Agentic Error Recovery: Communicating Failures and Enabling User Intervention"
    source: "Nielsen Norman Group Agentic UX Research 2024; USWDS Error Handling Guidance; GOV.UK Error Messages Playbook"
    license: "public-domain"
    summary: "Agentic error recovery patterns define how an AI agent communicates failures,
partial failures, and blocked states to users — and how users can intervene
to correct the situation. Government AI tools must treat every error as a
recoverable event with a clear user path forward, never as a dead end.
Error messages must use plain language, explain what happened and why,
and offer specific next steps the user can take.
"
    domain:
