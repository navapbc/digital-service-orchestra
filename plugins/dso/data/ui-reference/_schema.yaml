# _schema.yaml — UI/UX reference corpus vocabulary schema.
#
# This file defines the vocabulary for tag fields and the list of required
# fields for all corpus entries in this directory.
#
# optional_fields: fields that are allowed but not required, and whose values
# are not constrained by a vocabulary (free-text or arbitrary structure).
#
# Maintained by the DSO plugin. Do not edit without updating check-corpus-schema.py.

required_fields:
  - id
  - title
  - domain

