      - components
    pinned_version: "N/A"
    last_synced: "2026-05-24"
    notes: >
      GOV.UK Service Manual design patterns, including the one-question-per-page
      pattern, task list pattern, check-answers pattern, and confirmation pages.
      Published by the UK Government Digital Service under the Open Government
