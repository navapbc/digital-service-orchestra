# tests/fixtures/recipe-registry-test.yaml
# Test fixture: minimal recipe registry for detect-cleanup-recipes.sh tests.
# Contains normalize-imports entries for python, typescript, and ruby.
# Injected via RECIPE_REGISTRY_PATH env var in test scripts.
recipes:
  - name: normalize-imports
    language: python
    engine: isort
    adapter: isort-adapter.sh
    capability_description: "Sort and deduplicate Python import statements following PEP 8/isort conventions"
    scope: single-file
    min_engine_version: "5.0.0"
    installation_instructions: "pip install isort>=5"
  - name: normalize-imports
    language: typescript
    engine: ts-morph
    adapter: ts-morph-adapter.sh
    capability_description: "Sort and deduplicate TypeScript import statements using ts-morph organizeImports"
    scope: single-file
    min_engine_version: "17.0.0"
    installation_instructions: "npm install ts-morph@>=17"
  - name: normalize-imports
    language: ruby
    engine: synvert
    adapter: synvert-adapter.sh
    capability_description: "Sort and deduplicate Ruby require/require_relative statements"
    scope: single-file
    min_engine_version: "1.0.0"
    installation_instructions: "gem install synvert"
