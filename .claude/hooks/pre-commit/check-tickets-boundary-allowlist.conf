# check-tickets-boundary allowlist — files exempt from boundary enforcement
# Additional entries are added by individual story tasks.
# IMPORTANT: Do NOT put inline comments after path entries (# foo) — the reader
# does not strip trailing comments, and the full line becomes the glob pattern.

# Thin wrappers from epic e1b2-2653 SC1 refactors (these call the boundary, not bypass it)
plugins/dso/scripts/sprint-next-batch.sh
plugins/dso/scripts/sprint-list-epics.sh
plugins/dso/scripts/purge-non-project-tickets.sh

# Ticket CLI implementation scripts (these ARE the boundary)
plugins/dso/scripts/ticket-*.sh

# Pre-commit gate hook (enforces ticket existence via tracker)
plugins/dso/hooks/pre-commit-ticket-gate.sh

# Suggestions/review event accessors
plugins/dso/scripts/suggestion-record.sh
plugins/dso/scripts/retro-gather.sh
plugins/dso/scripts/compute-diff-hash.sh
plugins/dso/scripts/emit-review-event.sh
plugins/dso/scripts/capture-review-diff.sh

# Review-recording hook — uses .tickets-tracker/ as a git pathspec exclusion
# (mirrors compute-diff-hash.sh / capture-review-diff.sh), not as a tracker read.
plugins/dso/hooks/record-review.sh

# Merge orchestrator — manages the boundary by syncing the tickets branch
plugins/dso/scripts/merge-to-main.sh
plugins/dso/scripts/merge-to-main-direct.sh
plugins/dso/scripts/merge-to-main-pr.sh
# merge-helpers library (extracted from merge-to-main.sh; auto-resolves ticket-data
# conflicts during git pull --rebase as part of the same merge workflow)
plugins/dso/hooks/lib/merge-helpers.sh

# Exclusion-pattern scripts (classify .tickets-tracker/ paths, do not access them)
plugins/dso/scripts/skip-review-check.sh

# All tests are exempt — the boundary exists to enforce that ticket code can be
# broken out into a separate component later; test helpers that exercise that code
# are not the extraction target and must never be blocked by the boundary check.
tests/**

# Skill and CLI entry-point files that reference .tickets-tracker/ in documentation/examples
plugins/dso/scripts/ticket
plugins/dso/skills/sprint/SKILL.md
plugins/dso/skills/onboarding/SKILL.md

# The enforcement hook itself (contains pattern strings that would self-trigger)
plugins/dso/hooks/check-tickets-boundary.sh

# PreToolUse enforcement library (contains .tickets-tracker/ pattern strings to DETECT violations)
plugins/dso/hooks/lib/pre-bash-functions.sh

# Hook configuration and meta-files that describe the boundary (not enforce/bypass it)
.pre-commit-config.yaml
.claude/hooks/pre-commit/check-tickets-boundary-allowlist.conf

# Project instructions — describes the boundary for agents, does not access it
CLAUDE.md

# Test index (references test file names for absorbed scripts)
.test-index

# Gitignore: structural file paths
.gitignore

# Architecture doc — describes the ticket system storage layout, does not access it
plugins/dso/docs/ticket-system-v3-architecture.md

# Bridge component README — documents how the bridge legitimately reads the tracker
plugins/dso/scripts/bridge/README.md
