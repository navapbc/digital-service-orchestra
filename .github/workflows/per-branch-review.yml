name: Per-Branch Review

on:
  push:
    branches:
      - 'story/**'
      # bug-batch/** — debug-everything Phase F/G sub-branches.
      # Without this trigger every bug-batch/<session>/tier-<N>[-batch-<K>] PR
      # merges to its session branch without CI review (Flow C gap).
      - 'bug-batch/**'
      # fix/** — d076 spec coverage; reserved for ad-hoc fix branches.
      - 'fix/**'

permissions:
  contents: read
  checks: write
  pull-requests: write  # required so runner.py _post_pr_review can post findings via Pulls Reviews API + issue-comment fallback

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ vars.SPRINT_SESSION_ID }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './plugins/dso/scripts'
          # warning: suppress info/style-level findings (SC2295, SC2086, SC2016, etc.)
          # that are pre-existing and non-actionable. Only actual warnings+ block CI.
          severity: warning

  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check plugins/dso/scripts/

  # Hook Tests / Script Tests gate the LLM review so the reviewer never burns
  # tokens on a story branch whose deterministic checks are red. Bug
  # da45-7d92-6c86-42bc: PR #193 failed Script Tests on a real
  # plugin-script-relative-path violation while the LLM review ran in parallel
  # and chewed through tokens on a 7947-line diff. These jobs mirror ci.yml's
  # test-hooks / test-scripts (intentional duplication — per-branch-review.yml
  # fires on push:story/** which ci.yml does NOT cover, see ci.yml comment in
  # `on: push`).
  test-hooks:
    name: Hook Tests
    needs: [shellcheck, lint-python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUITE_TEST_INDEX: ${{ github.workspace }}/.test-index
    steps:
      - uses: actions/checkout@v4
      - name: Run hook tests
        run: bash tests/hooks/run-hook-tests.sh

  test-scripts:
    name: Script Tests
    needs: [shellcheck, lint-python]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUITE_TEST_INDEX: ${{ github.workspace }}/.test-index
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install ruff pyyaml jsonschema

      - name: Install hyperfine
        run: sudo apt-get update && sudo apt-get install -y hyperfine

      - name: Verify hyperfine installed
        run: hyperfine --version

      - name: Run script tests
        run: bash tests/scripts/run-script-tests.sh

  validate-required-checks:
    name: Validate required-checks.txt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Validate check-context names
        run: bash plugins/dso/scripts/onboarding/validate-required-checks.sh

  mirror-tracker-defenses:
    name: Mirror Tracker Defenses to PR
    needs: [actionlint, shellcheck, lint-python, test-hooks, test-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Mirror defenses to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "No open PR found for branch ${GITHUB_REF_NAME} — skipping defense mirror"
            exit 0
          fi
          # Fetch tickets orphan branch so review-defense-store.sh can read DEFENSE_RECORD entries.
          git fetch --no-tags origin '+refs/heads/tickets:refs/remotes/origin/tickets' 2>/dev/null || true
          if ! bash plugins/dso/scripts/review-defense-store.sh list --pr "$PR_NUMBER" \
            | bash plugins/dso/scripts/mirror-defenses-to-pr.sh "$PR_NUMBER"; then
            echo "Defense mirroring failed for PR ${PR_NUMBER}" >&2
            exit 1
          fi

  review:
    name: Per-Story LLM Review
    needs: [actionlint, shellcheck, lint-python, test-hooks, test-scripts, validate-required-checks, mirror-tracker-defenses]
    runs-on: ubuntu-latest
    # 30 min: region-split mode with 5 clusters takes ~12 min; 30 provides headroom.
    timeout-minutes: 30
    steps:
      - name: Checkout story branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize artifact name
        run: |
          SAFE_NAME="${GITHUB_REF_NAME//\//-}"
          echo "ARTIFACT_NAME=per-branch-review-${SAFE_NAME}" >> "$GITHUB_ENV"

      - name: Resolve diff base (PR base → SPRINT_SESSION_ID → main)
        # Bug 3914-0848-faad-4f6a: delegate to a unit-tested resolver script
        # rather than inline bash, so the resolution chain (PR base → variable
        # → main, with existence validation) can be tested behaviorally.
        # See plugins/dso/scripts/resolve-per-branch-review-base.sh and
        # tests/scripts/test-resolve-per-branch-review-base.sh.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPRINT_SESSION_ID: ${{ vars.SPRINT_SESSION_ID }}
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}" \
            bash plugins/dso/scripts/resolve-per-branch-review-base.sh \
            | tee /tmp/_base_ref.txt
          BASE_REF="$(cat /tmp/_base_ref.txt)"
          echo "BASE_REF=$BASE_REF" >> "$GITHUB_ENV"
          rm -f /tmp/_base_ref.txt

      - name: Fetch resolved diff base
        env:
          BASE_REF: ${{ env.BASE_REF }}
        run: git fetch origin "$BASE_REF"

      - name: Compute story diff (merge-base delta)
        env:
          BASE_REF: ${{ env.BASE_REF }}
        run: |
          BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          git diff "$BASE" HEAD > /tmp/story-diff.patch
          # Suspicious-diff sanity check: a properly-scoped per-story review
          # should rarely exceed ~1500 lines. If the diff blows past that, the
          # base resolution likely went wrong (stale variable, missing PR,
          # branch from an old session). Surface a clear warning instead of
          # silently producing a wrong-scoped review.
          DIFF_LINES=$(wc -l < /tmp/story-diff.patch | tr -d ' ')
          DIFF_THRESHOLD="${PER_BRANCH_DIFF_WARN_THRESHOLD:-1500}"
          echo "Story diff: ${DIFF_LINES} lines (BASE_REF=$BASE_REF, threshold=${DIFF_THRESHOLD})"
          if [[ "$DIFF_LINES" -gt "$DIFF_THRESHOLD" ]]; then
              echo "::warning::Story diff is ${DIFF_LINES} lines — exceeds ${DIFF_THRESHOLD}. The per-branch review is meant to operate on small scoped diffs; a large diff suggests the BASE_REF ($BASE_REF) is wrong. If this branch has an open PR, that PR's base should be the diff base. If reviewing many findings unrelated to this branch's intent, see bug 3914-0848-faad-4f6a."
          fi

      - name: Download prior review artifact (cycle tracking)
        # actions/download-artifact@v4 is intentionally NOT used here: it scopes artifact
        # lookup to the current run-id (even with github-token set), which makes it
        # impossible to download artifacts from a prior run. We need cross-run download to
        # retrieve the cycle N findings.json so cycle N+1 can build on prior defenses.
        # This gh api + curl approach is the only mechanism that supports cross-run lookup.
        # continue-on-error: true ensures a missing prior artifact (cycle 1) is non-fatal.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download from a PRIOR run (not the current run).
          # Filter out the current run-id so we get the most recent completed run's artifact.
          mkdir -p /tmp/prior-review
          # per_page=10: artifact names are branch-specific so accumulation is slow,
          # but 10 provides headroom without hitting API limits.
          ARTIFACT_URL=$(gh api \
            "/repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=10" \
            --jq ".artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .archive_download_url" \
            | head -1)
          if [[ -n "$ARTIFACT_URL" ]]; then
            # GitHub API download endpoints accept Bearer scheme (same as gh CLI internally).
            # -f: fail on HTTP errors (4xx/5xx) so a non-zip error response is not
            # silently passed to unzip as if it were a valid archive.
            curl -fsL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "$ARTIFACT_URL" -o /tmp/prior-review.zip && \
              unzip -o /tmp/prior-review.zip -d /tmp/prior-review/ && \
              echo "Downloaded prior artifact from $ARTIFACT_URL"
          else
            echo "No prior artifact found — cycle 1"
          fi

      - name: Install litellm
        # Pin to tested version; bump after verifying compatibility with ci-llm-review-runner.sh
        run: pip install litellm==1.83.7

      # Resolve PR number so runner.py can fetch DEFENSE_RECORD comments for cycle N≥2
      # suppression. push events don't expose github.event.pull_request.number, so we
      # use gh pr list to find the open PR for this branch.
      - name: Resolve PR number
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          if [[ "${PR_NUM}" =~ ^[0-9]+$ ]]; then
            echo "PR_NUMBER=${PR_NUM}" >> "$GITHUB_ENV"
            echo "Resolved PR_NUMBER=${PR_NUM}"
          else
            echo "No open PR found for branch ${GITHUB_REF_NAME} — defense suppression will be skipped"
          fi

      # Compute review cycle: each prior run uploads a story-diff artifact, but
      # the most reliable in-job signal here is the presence of the prior-review
      # artifact downloaded above. Read the prior cycle number from the
      # findings.json (runner.py writes `cycle_number` per cycle) and
      # increment. Falls back to cycle 1 when no artifact is present, and
      # to prior=1 (current=2) when the field is missing/unparseable.
      - name: Compute DSO_REVIEW_CYCLE
        run: |
          if [[ -s /tmp/prior-review/findings.json ]]; then
            # Read prior cycle_number from the artifact (runner.py writes
            # this field per cycle). Use jq because it parses single-line
            # safely without triggering YAML/bash quoting hazards. Falls
            # back to prior=1 on any parse error or missing field.
            PRIOR_CYCLE=$(jq -r '.cycle_number // 1' /tmp/prior-review/findings.json 2>/dev/null || echo 1)
            [[ "$PRIOR_CYCLE" =~ ^[0-9]+$ ]] || PRIOR_CYCLE=1
            CURRENT_CYCLE=$((PRIOR_CYCLE + 1))
            echo "DSO_REVIEW_CYCLE=$CURRENT_CYCLE" >> "$GITHUB_ENV"
            echo "Computed DSO_REVIEW_CYCLE=$CURRENT_CYCLE (prior cycle from artifact: $PRIOR_CYCLE)"
          else
            echo "DSO_REVIEW_CYCLE=1" >> "$GITHUB_ENV"
            echo "Computed DSO_REVIEW_CYCLE=1 (no prior-review artifact)"
          fi

      - name: Run LLM review
        run: bash plugins/dso/scripts/ci-llm-review-runner.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_PLUGIN_ROOT: "${{ github.workspace }}/plugins/dso"
          DSO_CI_REVIEW_DIFF_PATH: /tmp/story-diff.patch
          DSO_CI_REVIEW_PRIOR_DEFENSES_PATH: /tmp/prior-review/findings.json
          # Persist the runner's findings JSON so the NEXT cycle can read
          # cycle_number from it (see "Compute DSO_REVIEW_CYCLE" above) and
          # so DSO_CI_REVIEW_PRIOR_DEFENSES_PATH on the next run points at
          # a file that actually exists.
          DSO_CI_REVIEW_OUTPUT_PATH: /tmp/findings.json
          DSO_CI_REVIEW_DRY_RUN: ${{ vars.DSO_CI_REVIEW_DRY_RUN || '' }}
          DSO_REVIEW_CYCLE: ${{ env.DSO_REVIEW_CYCLE }}
          # PR_NUMBER enables runner.py defense suppression in push-triggered workflows.
          # Set by "Resolve PR number" step above; absent on branches without open PRs.
          PR_NUMBER: ${{ env.PR_NUMBER }}

      - name: Assert review liveness
        # c131-0f34: fails the job if the runner did not produce
        # /tmp/findings.json or if the file is malformed. Defends against the
        # silent-exit-0 regression class.
        shell: bash -eo pipefail {0}
        run: |
          if [ ! -s /tmp/findings.json ]; then
            echo "ERROR [liveness]: /tmp/findings.json missing or empty" >&2
            exit 1
          fi
          if ! jq -e 'has("findings") and (.findings | type == "array")' /tmp/findings.json >/dev/null 2>&1; then
            echo "ERROR [liveness]: /tmp/findings.json malformed — 'findings' missing, not an array, or invalid JSON" >&2
            head -c 500 /tmp/findings.json 2>/dev/null | sed 's/^/  | /' >&2 || true
            exit 1
          fi
          echo "review liveness: ok ($(jq -r '.findings | length' /tmp/findings.json) findings)"

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            /tmp/story-diff.patch
            /tmp/findings.json
          retention-days: 7
          if-no-files-found: warn
