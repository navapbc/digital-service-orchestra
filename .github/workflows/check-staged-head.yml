name: Check Staged Head Branch

# Enforces the two-tier promotion model: only branches matching `staged-*`
# may merge into main. This workflow runs on every PR targeting main and
# fails if the head branch doesn't match the pattern. The job's check name
# (`check-staged-head`) is wired into .github/required-checks.txt so the
# main ruleset's required_status_checks rule enforces it.
#
# Why this gate exists: the sub-PR ruleset (16961402) enforces
# `review-sub-pr` on every PR INTO staged-*. By restricting main-bound PRs
# to staged-* sources, we guarantee every change reaching main has been
# through at least one review-sub-pr cycle. Feature branches stay
# unrestricted so dev work isn't blocked.
#
# Bypass: admins under the main ruleset's bypass_mode=pull_request still
# trigger the visible "Merge without checks" prompt, creating an
# audit-trail entry on every bypass.

on:
  pull_request:
    branches: [main]
    # ready_for_review is REQUIRED alongside the draft pass-through below: when a
    # draft PR is marked ready WITHOUT a new push, only this activity type
    # re-triggers the gate so it re-evaluates non-draft. Omitting it would let a
    # session→main PR pass-as-draft and then merge once readied — a bypass.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  check-staged-head:
    name: check-staged-head
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify head branch matches staged-* pattern
        env:
          HEAD_REF: ${{ github.head_ref }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          # Draft PRs cannot merge, so this gate is moot for them. The sprint
          # umbrella defense-substrate PR (base=main, head=session) is always a
          # draft; without this pass-through its failure (head ≠ staged-*) attaches
          # to the shared head commit and contaminates PR1 (source→staged), which
          # shares the same head SHA, blocking the two-tier promotion (bug 1f5f).
          # This is NOT a bypass: ready_for_review re-triggers the workflow, so the
          # gate re-evaluates the moment the PR becomes mergeable.
          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "Draft PR — check-staged-head defers until the PR is marked ready; passing."
            exit 0
          fi
          if [[ -z "$HEAD_REF" ]]; then
            echo "::error::HEAD_REF is empty — refusing to evaluate; treating as fail-closed."
            exit 1
          fi
          case "$HEAD_REF" in
            staged-*)
              echo "PR head '$HEAD_REF' matches required 'staged-*' pattern."
              exit 0
              ;;
            *)
              echo "::error::PR head branch '$HEAD_REF' does not match required 'staged-*' pattern."
              echo "Only branches matching 'staged-*' may merge into main."
              echo ""
              echo "Workflow:"
              echo "  1. Branch your work normally (e.g. 'fix/my-bug')."
              echo "  2. Open a PR from your branch into a staged-* branch."
              echo "  3. After review-sub-pr passes and the PR merges to staged-*,"
              echo "     open a PR from staged-* into main."
              exit 1
              ;;
          esac
