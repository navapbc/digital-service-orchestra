name: ruleset-design-invariants

# Runs the two-tier promotion gate invariant test against the live GitHub
# Rulesets state. The check is wired into .github/required-checks.txt as
# a required status check on the main ruleset — drift detected = merge
# blocked.
#
# IMPORTANT: this workflow MUST fire on every PR to main. A required check
# that doesn't run leaves the PR's mergeability state pending forever
# (GitHub treats absent required checks as blocking). The previous
# `on.pull_request.paths` filter created exactly that deadlock — any PR
# not touching one of the listed files would have a missing required check.
# Removing the filter; the workflow is cheap (~3 API calls, ~30s) and the
# drift signal is worth firing on every PR.
on:
  pull_request:

# administration:read is required to call the Rulesets API. contents:read
# alone returns 403/empty.
permissions:
  contents: read
  administration: read

jobs:
  ruleset-design-invariants:
    name: ruleset-design-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Pinned to commit SHA per repo security guidance. persist-credentials:
      # false prevents the action from leaving the GITHUB_TOKEN in
      # .git/config after checkout, so subsequent gh calls use the
      # explicit GH_TOKEN env instead.
      - uses: actions/checkout@fd084cde189b7b76ec305d52e27be545a0172823  # v4
        with:
          persist-credentials: false

      - name: Run invariant test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          bash tests/scripts/test-ruleset-design-invariants.sh
