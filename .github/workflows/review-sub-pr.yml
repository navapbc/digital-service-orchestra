name: review-sub-pr
# Trigger: every PR whose base is NOT the host's default branch. Mirrors the
# sub-PR ruleset (provision-ruleset.sh emits include="~ALL",
# exclude=["refs/heads/<default-branch>"]), so the workflow runs exactly on
# the PRs the ruleset enforces. Adding a new branch convention requires no
# workflow change.
#
# HOST PROJECT NOTE: GitHub Actions YAML cannot dynamically read a host's
# default branch, so the value below is a literal. If your host project's
# default branch is not "main" (e.g., master, trunk, develop), change the
# literal here AND run `provision-ruleset.sh` or `sync-sub-pr-ruleset.sh`
# with `DSO_DEFAULT_BRANCH=<your-branch>` so the live ruleset matches.
"on":
  pull_request:
    branches-ignore:
      - main

# R5 (PR-2): concurrency group prevents overlapping runs on rapid force-pushes.
# cancel-in-progress is appropriate for review workflows — a stale review
# against a superseded commit is wasteful. Note: cancelled runs report
# conclusion=cancelled, which R2 (verify-session-provenance.sh) treats as
# unreviewed → SHA marked unprovenanced at session→main. Correct behavior:
# cancelled = no review evidence.
concurrency:
  group: review-sub-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  llm-review-sub-pr:
    name: review-sub-pr
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the findings-artifact path. Both the
      # `Compute diff and run reviewer` step (writer, via DSO_CI_REVIEW_OUTPUT_PATH)
      # and the `Assert review liveness` step (validator) reference this var.
      DSO_CI_REVIEW_FINDINGS_PATH: /tmp/findings.json
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: pip install litellm==1.83.7
      - name: Compute diff and run reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.number }}
          # c131-0f34: persist the runner's findings JSON so the liveness step
          # below can assert it exists and is well-formed.
          DSO_CI_REVIEW_OUTPUT_PATH: ${{ env.DSO_CI_REVIEW_FINDINGS_PATH }}
        shell: bash -eo pipefail {0}
        run: |
          _DIFF_PATH=$(mktemp /tmp/dso-sub-pr-diff.XXXXXX)
          trap 'rm -f "$_DIFF_PATH"' EXIT
          gh pr diff "$PR_NUMBER" > "$_DIFF_PATH"
          # R4 (PR-2): workflow-level empty-diff guard. The runner has an
          # empty-diff guard (`runner.py:_read_diff`) but a workflow-level
          # check makes the failure mode visible before the runner is
          # invoked, resilient to runner-side regressions.
          if [[ ! -s "$_DIFF_PATH" ]]; then
              echo "ERROR: gh pr diff produced empty output for PR #$PR_NUMBER" >&2
              echo "ERROR: refusing to dispatch reviewer with empty diff (force-push race, rebased PR, or closed state)" >&2
              exit 1
          fi
          DSO_CI_REVIEW_DIFF_PATH="$_DIFF_PATH" bash plugins/dso/scripts/ci-llm-review-runner.sh

      - name: Assert review liveness
        # c131-0f34: end-to-end liveness invariant. Fails the job if the
        # runner did not write /tmp/findings.json, or if the file is empty or
        # does not contain the expected `findings` key. Catches the silent-
        # exit-0 regression class that would otherwise let PRs merge with no
        # review having actually run.
        shell: bash -eo pipefail {0}
        run: |
          F="${DSO_CI_REVIEW_FINDINGS_PATH:?DSO_CI_REVIEW_FINDINGS_PATH not set}"
          if [ ! -s "$F" ]; then
            echo "ERROR [liveness]: $F missing or empty — runner did not produce review output" >&2
            exit 1
          fi
          if ! jq -e 'has("findings") and (.findings | type == "array")' "$F" >/dev/null 2>&1; then
            echo "ERROR [liveness]: $F malformed — 'findings' missing, not an array, or invalid JSON" >&2
            head -c 500 "$F" 2>/dev/null | sed 's/^/  | /' >&2 || true
            exit 1
          fi
          echo "review liveness: ok ($(jq -r '.findings | length' "$F") findings)"
