# Digital Service Orchestra (DSO) — Continuous Integration
# Runs shellcheck, Python linting, and plugin tests.
#
# ── merge-pipeline-checks umbrella job ──────────────────────────────────────
# Job: merge-pipeline-checks
#   Stable check-context name that branch protection can require by job name.
#   Runs on every pull_request event targeting session/**, session-**, session_**,
#   bug-batch/**, or main. The job always reports a result on the stable check-context
#   name regardless of which inner steps fire (umbrella pattern).
#
#   Step: red-test-blocker
#     Fires only when PR base == main AND head matches a session/** or bug-batch/**
#     pattern. Invokes plugins/dso/scripts/scan-red-markers.sh with explicit commit
#     SHAs (not refs, to avoid race conditions with concurrent pushes) captured at
#     job-start. Fails the umbrella when any RED markers are found in the merged tree.
#
#   Override mechanism for intentional RED markers:
#     scan-red-markers.sh honours '# DEFERRED: <path>:<test_name> reason=<text> ticket=<id>'
#     header lines in .test-index. When a marker matches a DEFERRED exemption, the scanner
#     logs "WARN: RED marker ... intentionally deferred (ticket=<id>) — not blocking" and
#     does NOT exit non-zero. Both blocking and exempt markers are listed in job output.
#     See plugins/dso/scripts/scan-red-markers.sh for implementation details.

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'epic/**'
      - 'exp/**'
      # NOTE: 'story/**' intentionally NOT included here. Story branches
      # always have an open PR; the pull_request trigger below covers them.
      # Adding push:story/** would duplicate every CI job per push (push +
      # pull_request fire at the same time on different github.ref values,
      # so concurrency.group does not dedupe them). Discovered post-3914.
  pull_request:
    # PRs targeting any branch run the full CI suite. Previously this was
    # restricted to PRs targeting main, which meant per-story PRs (head=story/X,
    # base=session_branch=story/Y) skipped ALL CI tests — only per-branch-
    # review.yml's LLM check ran. Removing the branches filter makes ci.yml run
    # on every PR regardless of base. Bug 3914-0848-faad-4f6a.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Path-change detection ───────────────────────────────────
  # Mirrors the local review-gate skip logic by invoking
  # plugins/dso/scripts/skip-review-check.sh — the SAME script used by
  # COMMIT-WORKFLOW.md Step 0.5 to decide whether a local commit can skip
  # review. This eliminates the divergence that allowed PR #66 to merge
  # silently: the prior `.md`-blanket exclude let CLAUDE.md and skill .md
  # changes skip tests entirely, even though those files affect agent
  # behavior and ARE classified as reviewable by the local gate.
  #
  # skip-review-check.sh classifies a file list (one file per line on stdin):
  #   exit 0 → SKIP_REVIEW=true  (all files allowlisted, e.g. tickets, images,
  #                                lockfiles); CI can skip downstream tests.
  #   exit 1 → SKIP_REVIEW=false (at least one reviewable file: CLAUDE.md,
  #                                hooks/, skills/, docs/workflows/, or any
  #                                file not matched by review-gate-allowlist.conf);
  #                                CI MUST run downstream tests.
  #
  # DSO_FORCE_LOCAL_REVIEW=1 disables skip-review-check.sh's
  # dso.workflow=ci-pr short-circuit (which is intended for the local
  # pipeline, NOT for CI itself).
  #
  # Bug f776-d7ef: PR #66 merged with green CI because the prior `.md`-only
  # filter classified its 8 .md changes as code_changed=false. Hook/Script/
  # Python tests then "ran" in 4-5s (no-op) and reported SUCCESS — but the
  # underlying tests would have failed (and did, on the post-merge push event).
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect reviewable changes (mirrors local review-gate)
        id: filter
        run: |
          set -euo pipefail
          # Non-PR events (push, workflow_dispatch) always run the full pipeline.
          # Short-circuit before computing the diff to avoid sentinel-string fragility.
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "Event ${GITHUB_EVENT_NAME}: forcing code_changed=true"
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_REF="origin/${{ github.base_ref }}"
          # Verify BASE_REF is fetched before computing the diff. fetch-depth: 0
          # on actions/checkout@v4 fetches all refs; this guard fails loud rather
          # than silent if the runner's checkout shape ever changes.
          if ! git rev-parse --verify --quiet "$BASE_REF" >/dev/null; then
            echo "ERROR: base ref ${BASE_REF} not found in local refs after checkout. Forcing code_changed=true to be safe." >&2
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_REF...HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          # Verify the local review-gate skip script is present. Fail-loud if
          # absent rather than silently falling back to the broken `.md`-only
          # heuristic (the very gap that landed PR #66 with broken tests).
          SKIP_SCRIPT="plugins/dso/scripts/skip-review-check.sh"
          if [[ ! -x "$SKIP_SCRIPT" ]]; then
            echo "ERROR: ${SKIP_SCRIPT} not found or not executable. Forcing code_changed=true to be safe." >&2
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Run the same classifier the local review gate uses.
          # exit 0 → all files allowlisted (tests can skip)
          # exit 1 → at least one reviewable file (tests MUST run)
          # DSO_FORCE_LOCAL_REVIEW=1 is defense-in-depth: skip-review-check.sh
          # now auto-detects CI via CI/GITHUB_ACTIONS env vars, but we keep
          # the explicit override as belt-and-suspenders (F6 hardening).
          set +e
          echo "$CHANGED" | DSO_FORCE_LOCAL_REVIEW=1 bash "$SKIP_SCRIPT"
          SKIP_RC=$?
          set -e
          if [[ "$SKIP_RC" -eq 0 ]]; then
            echo "skip-review-check: all changes allowlisted — code_changed=false"
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$SKIP_RC" -eq 1 ]]; then
            echo "skip-review-check: reviewable changes detected — code_changed=true"
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: skip-review-check.sh exited ${SKIP_RC} (expected 0 or 1). Forcing code_changed=true to be safe." >&2
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Fast gates ──────────────────────────────────────────────

  actionlint:
    name: Actionlint
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run actionlint
        if: needs.changes.outputs.code_changed == 'true'
        run: actionlint -color

      - name: Job timing report
        if: always()
        run: echo "actionlint completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  shellcheck:
    name: ShellCheck
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        # Download from GitHub releases instead of apt to avoid azure.archive.ubuntu.com
        # DNS outages on Azure-hosted runners (saw 3 consecutive cancellations 2026-05-02).
        # github.com DNS is independent of the apt repo mirrors.
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          set -euo pipefail
          SHELLCHECK_VERSION=v0.10.0
          TARBALL="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 \
                "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${TARBALL}" \
                -o "${TARBALL}"; then
              break
            fi
            echo "Download attempt ${attempt} failed; retrying..." >&2
            sleep 10
          done
          tar -xJf "${TARBALL}"
          sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          rm -rf "shellcheck-${SHELLCHECK_VERSION}" "${TARBALL}"
          shellcheck --version

      - name: Run shellcheck
        if: needs.changes.outputs.code_changed == 'true'
        run: shellcheck --severity=warning plugins/dso/scripts/*.sh plugins/dso/hooks/*.sh plugins/dso/hooks/**/*.sh

      - name: Job timing report
        if: always()
        run: echo "shellcheck completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  lint-python:
    name: Lint Python (ruff)
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        if: needs.changes.outputs.code_changed == 'true'
        run: pip install ruff

      - name: Ruff check
        if: needs.changes.outputs.code_changed == 'true'
        run: ruff check plugins/dso/scripts/*.py tests/**/*.py

      - name: Ruff format check
        if: needs.changes.outputs.code_changed == 'true'
        run: ruff format --check plugins/dso/scripts/*.py tests/**/*.py

      - name: Job timing report
        if: always()
        run: echo "lint-python completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ── Full test suite ─────────────────────────────────────────

  test-hooks:
    name: Hook Tests
    needs: [changes, shellcheck, lint-python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # RED-zone marker tolerance is intentionally NOT enabled in CI: tolerance
    # is a development-time TDD aid and must not mask failures in PRs targeting
    # main. Runners auto-disable on CI=true / GITHUB_ACTIONS=true (defense in
    # depth) regardless of SUITE_TEST_INDEX. See plugins/dso/docs/HOOKS-REFERENCE.md.
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 — consistent with test-scripts job. Hook tests may
          # also dispatch the llm-review wrapper which fail-closes on shallow.
          fetch-depth: 0

      - name: Run hook tests
        if: needs.changes.outputs.code_changed == 'true'
        # `set -o pipefail` so the left-hand exit status of `tee` propagates.
        # Without it, the test failure would be masked by tee's exit 0.
        shell: bash
        run: |
          set -o pipefail
          bash tests/hooks/run-hook-tests.sh 2>&1 | tee /tmp/test-hooks.log

      - name: Upload hook test logs (audit P5-4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-hooks-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/test-hooks.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Job timing report
        if: always()
        run: echo "test-hooks completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  test-scripts:
    name: Script Tests
    needs: [changes, shellcheck, lint-python]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # RED-zone marker tolerance is intentionally NOT enabled in CI: tolerance
    # is a development-time TDD aid and must not mask failures in PRs targeting
    # main. Runners auto-disable on CI=true / GITHUB_ACTIONS=true (defense in
    # depth) regardless of SUITE_TEST_INDEX. See plugins/dso/docs/HOOKS-REFERENCE.md.
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 required for tests that exercise the llm-review
          # dispatcher's shallow-repository fail-closed gate (R3a v4.1).
          # Tests inherit the runner's git context as the dispatcher CWD;
          # default shallow checkout (depth=1) trips the fail-closed gate
          # before tests can exercise their intended scenarios.
          fetch-depth: 0

      - name: Set up Python
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: pip install ruff pyyaml jsonschema

      - name: Install hyperfine
        if: needs.changes.outputs.code_changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y hyperfine

      - name: Verify hyperfine installed
        if: needs.changes.outputs.code_changed == 'true'
        run: hyperfine --version

      # ast-grep powers check-dangling-references.sh's syntactic matcher. Install
      # the real binary (`ast-grep`) — on Linux bare `sg` is shadow-utils, a
      # different tool that silently produces no matches (false negatives).
      # Installed via pip here because this job already ran `actions/setup-python`
      # above (pip-writable env). The standalone dangling-references.yml uses npm
      # instead (no Python setup there). Methods differ BY DESIGN; pin is shared:
      # 0.43.0 is brew-only; the PyPI/npm maximum is 0.42.3. Bump both together.
      - name: Install ast-grep
        if: needs.changes.outputs.code_changed == 'true'
        run: pip install 'ast-grep-cli==0.42.3'

      - name: Verify ast-grep installed
        if: needs.changes.outputs.code_changed == 'true'
        run: ast-grep --version

      - name: Run script tests
        if: needs.changes.outputs.code_changed == 'true'
        shell: bash
        env:
          # bug a556 + INC-006: enable suite-engine's isolation check so any
          # test that writes to a known shared /tmp path (bypassing the per-test
          # TMPDIR sandbox) is reported as a violation. Tests that follow the
          # documented mktemp "${TMPDIR:-/tmp}/<prefix>.XXXXXX" pattern are
          # unaffected (their writes land inside the per-test sandbox).
          SUITE_ISOLATION_CHECK: '1'
        run: |
          set -o pipefail
          bash tests/scripts/run-script-tests.sh 2>&1 | tee /tmp/test-scripts.log

      - name: Upload script test logs (audit P5-4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-scripts-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/test-scripts.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Job timing report
        if: always()
        run: echo "test-scripts completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  validate-required-checks:
    name: Validate required-checks.txt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Validate check-context names
        run: bash plugins/dso/scripts/onboarding/validate-required-checks.sh

  # ── Mirror tracker defenses to PR ───────────────────────────

  mirror-defenses-to-pr:
    name: Mirror Tracker Defenses to PR
    needs: [changes, test-hooks, test-scripts]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Mirror defenses to PR
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Producer: review-defense-store.sh list scans the tickets orphan branch
        # for all stored DEFENSE_RECORD entries and emits them on stdout (one per
        # line in "DEFENSE_RECORD: <json>" form). mirror-defenses-to-pr.sh reads
        # those lines from stdin and posts each as a PR comment.
        # Bug cluster RC-A: this step used to invoke mirror-defenses-to-pr.sh
        # with no stdin producer, so its `while read -r line` loop received
        # nothing and the CI defense-suppression pipeline was a no-op.
        run: |
          PR_NUMBER="${GITHUB_REF#refs/pull/}"
          PR_NUMBER="${PR_NUMBER%/merge}"
          # Ensure the tickets ref is fetched so review-defense-store.sh list
          # can read DEFENSE_RECORD comments from it. actions/checkout@v4 does
          # not fetch the orphan tickets branch by default.
          git fetch --no-tags origin '+refs/heads/tickets:refs/remotes/origin/tickets' 2>/dev/null || true
          bash plugins/dso/scripts/review-defense-store.sh list --pr "$PR_NUMBER" \
            | bash plugins/dso/scripts/mirror-defenses-to-pr.sh "$PR_NUMBER" || true

  # ── Per-sub-PR LLM review (migrated from review-sub-pr.yml) ─────────
  #
  # Gated behind the deterministic checks so we don't pay for an LLM API
  # call when the PR is already failing on free signals. Same skip-handling
  # pattern as the other jobs: the job always runs (so the required check
  # always reports), but expensive steps have `if: code_changed == 'true'`
  # to skip when no relevant files changed.
  #
  # HOST PROJECT NOTE: GitHub Actions YAML cannot dynamically read a host's
  # default branch. The literal `'main'` below matches the sub-PR ruleset's
  # exclude pattern (provision-ruleset.sh emits include="refs/heads/staged-*"
  # — review fires on PRs into staged-* but not into main). If your host
  # project's default branch is not "main", change the literal here AND
  # re-run `provision-ruleset.sh` so the live ruleset matches.
  #
  # KNOWN LEAK: ticket-platform-matrix.yml runs in a separate workflow file
  # and cannot be referenced via `needs:` here. If ticket tests fail there
  # while ci.yml is green, this expensive LLM-review call will still fire
  # and incur API cost. The leak is bounded because ticket-platform-matrix
  # has a `paths:` filter restricting it to ticket-system files; most PRs
  # don't trigger it at all.

  llm-review-sub-pr:
    # `name:` MUST stay "review-sub-pr" — the sub-PR ruleset (16961402)
    # requires this exact check context. Changing it requires a ruleset PATCH
    # in lockstep, or all sub-PRs deadlock.
    name: review-sub-pr
    needs: [changes, actionlint, shellcheck, lint-python, test-hooks, test-scripts]
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Single source of truth for the findings-artifact path. Both the
      # `Compute diff and run reviewer` step (writer) and the `Assert
      # review liveness` step (validator) reference this var.
      DSO_CI_REVIEW_FINDINGS_PATH: /tmp/findings.json
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code_changed == 'true'
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: pip install litellm==1.83.7
      - name: Compute diff and run reviewer
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.number }}
          # c131-0f34: persist the runner's findings JSON so the liveness
          # step below can assert it exists and is well-formed.
          DSO_CI_REVIEW_OUTPUT_PATH: ${{ env.DSO_CI_REVIEW_FINDINGS_PATH }}
        shell: bash -eo pipefail {0}
        run: |
          _DIFF_PATH=$(mktemp /tmp/dso-sub-pr-diff.XXXXXX)
          trap 'rm -f "$_DIFF_PATH"' EXIT
          gh pr diff "$PR_NUMBER" > "$_DIFF_PATH"
          # R4 (PR-2): workflow-level empty-diff guard. The runner has an
          # empty-diff guard (`runner.py:_read_diff`) but a workflow-level
          # check makes the failure mode visible before the runner is
          # invoked, resilient to runner-side regressions.
          if [[ ! -s "$_DIFF_PATH" ]]; then
              echo "ERROR: gh pr diff produced empty output for PR #$PR_NUMBER" >&2
              echo "ERROR: refusing to dispatch reviewer with empty diff (force-push race, rebased PR, or closed state)" >&2
              exit 1
          fi
          DSO_CI_REVIEW_DIFF_PATH="$_DIFF_PATH" bash plugins/dso/scripts/ci-llm-review-runner.sh

      - name: Assert review liveness
        if: needs.changes.outputs.code_changed == 'true'
        # c131-0f34: end-to-end liveness invariant. Fails the job if the
        # runner did not write /tmp/findings.json, or if the file is empty
        # or does not contain the expected `findings` key. Catches the
        # silent-exit-0 regression class that would otherwise let PRs merge
        # with no review having actually run.
        shell: bash -eo pipefail {0}
        run: |
          F="${DSO_CI_REVIEW_FINDINGS_PATH:?DSO_CI_REVIEW_FINDINGS_PATH not set}"
          if [ ! -s "$F" ]; then
            echo "ERROR [liveness]: $F missing or empty — runner did not produce review output" >&2
            exit 1
          fi
          if ! jq -e 'has("findings") and (.findings | type == "array")' "$F" >/dev/null 2>&1; then
            echo "ERROR [liveness]: $F malformed — 'findings' missing, not an array, or invalid JSON" >&2
            head -c 500 "$F" 2>/dev/null | sed 's/^/  | /' >&2 || true
            exit 1
          fi
          echo "review liveness: ok ($(jq -r '.findings | length' "$F") findings)"

  # ── LLM code review (integration scope, on PRs to main) ─────────────
  #
  # KNOWN LEAK: ticket-platform-matrix.yml runs in a separate workflow file
  # and cannot be referenced via `needs:` here. If ticket tests fail there
  # while ci.yml is green, this expensive LLM-review call will still fire
  # and incur API cost. The leak is bounded by the workflow's `paths:`
  # filter; most PRs don't trigger it at all.

  llm-review:
    needs: [changes, actionlint, test-hooks, test-scripts, mirror-defenses-to-pr]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    # 45-minute ceiling accommodates full-diff fallback when per-story
    # DSO-Story-Merge trailers are absent and the suppress-defenses step
    # finds no per-story records (see bug db71-e078-ec99-4fbf).
    timeout-minutes: 45
    env:
      # Single source of truth for the findings-artifact path. Both the
      # `Run LLM review` step (writer, via DSO_CI_REVIEW_OUTPUT_PATH) and
      # the `Assert review liveness` step (validator) reference this var,
      # so a future change to the path drifts in one place, not two.
      # c131-0f34 review cycle 4.
      DSO_CI_REVIEW_FINDINGS_PATH: /tmp/findings.json
    permissions:
      contents: read
      pull-requests: write
      # REVIEW-DEFENSE: id-token: write is intentionally absent. Adding it would trigger
      # the claude-code-action OIDC app-token exchange, which validates the workflow file
      # is identical to the main branch as a security check. Any PR that modifies ci.yml
      # (including this one) fails that check with 401 Unauthorized. The action authenticates
      # via ANTHROPIC_API_KEY (direct API key auth) and does not need OIDC.
    steps:
      - uses: actions/checkout@v4
        with:
          # bug e349-6b4e-13c5-4e23: full history needed for git log
          # `origin/${{ github.base_ref }}..HEAD` traversal in cross-branch
          # trailer-grep AND in compute-cross-branch-from-api.sh fallback.
          # The defensive bootstrap in compute-cross-branch-from-api.sh
          # provides defense-in-depth; this is the primary fix.
          fetch-depth: 0

      - name: Install litellm
        if: needs.changes.outputs.code_changed == 'true'
        run: pip install litellm==1.83.7

      - name: Smoke-test review-complexity-classifier.sh
        if: needs.changes.outputs.code_changed == 'true'
        env:
          CLAUDE_PLUGIN_ROOT: "${{ github.workspace }}/plugins/dso"
        run: |
          set -euo pipefail
          FIXTURE="tests/fixtures/ci-review-corpus/fixture-diff.txt"
          if [[ -f "$FIXTURE" ]]; then
            DIFF_FILE="$FIXTURE"
          else
            echo 'No fixture diff found — generating minimal synthetic diff'
            DIFF_FILE=$(mktemp /tmp/smoke-test-diff.XXXXXX)
            printf '+foo\n-bar\n' > "$DIFF_FILE"
          fi
          OUTPUT=$(bash plugins/dso/scripts/review-complexity-classifier.sh < "$DIFF_FILE")
          echo "$OUTPUT" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("selected_tier") in {"light","standard","deep"}, f"invalid: {d}"'
          echo "Smoke test passed: $OUTPUT"

      # Compute the current llm-review cycle number by counting prior
      # "## DSO llm-review — finding 1/N" headers across both posting paths:
      #   - Issue comments (gh pr comment fallback path — no cited_lines anchor)
      #   - PR review-thread comments (primary path — Pulls Reviews API, bug 59e3-8b8b fix)
      # Each prior cycle posts exactly one finding-1 header regardless of path,
      # so the union count equals the number of prior cycles. PRIOR + 1 gives the
      # current cycle. Exported via $GITHUB_ENV so runner.py cycle_number gate
      # (runner.py:789) sees the real value — without this, every cycle>=2
      # suppression branch was structurally disabled.
      # ── Integration review scope: narrow scope for session→main PRs ──────────
      # Steps below identify only the files that need integration-level review:
      #   1. Un-provenanced commits (not traced to any story PR)
      #   2. Cross-branch files (changed in ≥2 story PRs — potential conflicts)
      # If both sets are empty, the integration review is skipped (scope empty).

      - name: Verify session provenance
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSO_ARTIFACT_DIR: ${{ runner.temp }}/dso-review
          # (Admin exemption is identity-based per ADR-0022: verify-session-provenance
          # honors a covering PR merged by a designated bypass-actor — resolved from
          # ruleset.bypass_user_ids inside the gate. No ledger env, no signing key.)
          # PR_NUMBER must be exported so verify-session-provenance.sh's A1
          # self-exclusion filter (bug 8a77) can identify and reject the
          # PR-under-review when it appears in the GH API response. Without
          # this, A1 is a no-op (defaults to 0) and the script can silently
          # treat self-PR-only coverage as "provenanced" — the original bug
          # 8a77 symptom that persisted past PR #259's partial fix.
          # Pattern matches the GITHUB_REF parse used by other steps in this
          # workflow (e.g., lines 347-348, 537-538).
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$DSO_ARTIFACT_DIR"
          # Ensure the base ref is fetched with FULL ancestor history before
          # computing the provenance range. PR-2 follow-up: the previous
          # --depth=1 fetch made origin/<base_ref> a shallow ref locally,
          # which broke two things:
          #   1. The new already-merged filter (^origin/<base_ref>) — only the
          #      tip excluded, not the thousands of ancestor commits.
          #   2. The existing BASE_SHA..SESSION_HEAD range — git can't compute
          #      "reachable from BASE_SHA" for ancestors not in the object DB,
          #      so historically-merged commits incorrectly fell into the range.
          # Both issues drove the verifier into BUDGET_EXHAUSTED on PRs based
          # on older main snapshots. Full fetch fixes both.
          git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
          # Retro-review of PR #168 found that passing DSO_BASE_SHA as the
          # symbolic ref string "origin/<base>" silently false-passes when the
          # fetch above fails: the ref is unresolvable, `git log
          # origin/main..HEAD` produces an empty range, the script exits 0,
          # and the integration-scope step sees zero unprovenanced commits.
          # Resolve the ref to a concrete SHA after fetch and fail the step
          # loudly if resolution doesn't succeed — that surfaces the missing
          # fetch instead of masking it.
          BASE_SHA=$(git rev-parse --verify "origin/${{ github.base_ref }}^{commit}" 2>/dev/null || true)
          if [[ -z "$BASE_SHA" ]]; then
              echo "ERROR: cannot resolve origin/${{ github.base_ref }} after fetch — provenance check would silently false-pass; aborting step." >&2
              exit 1
          fi
          # bug 8a77 v2 Change D: route on verifier exit code.
          # Documented codes (0/1/2/3) proceed; exit 4 = unreachable SHA
          # configuration error and MUST fail the step loud (previous pattern
          # `2>/dev/null || true` swallowed it, burying the original bug).
          #
          # NOTE: the script reads DSO_BASE_SHA / DSO_SESSION_HEAD from env;
          # it does NOT parse CLI flags. Passing --base-ref silently no-ops.
          rc=0
          DSO_BASE_SHA="$BASE_SHA" \
            bash plugins/dso/scripts/verify-session-provenance.sh \
            || rc=$?
          case "$rc" in
            0|1|2|3)
              # Documented exit codes — proceed. Stderr is on the job log.
              ;;
            4)
              echo "::error::verify-session-provenance.sh exit 4 — BASE_SHA or SESSION_HEAD unreachable. See stderr above for hints (typically: actions/checkout fetch-depth)."
              exit 1
              ;;
            *)
              echo "::error::verify-session-provenance.sh exited with unexpected code $rc"
              exit 1
              ;;
          esac
          echo "DSO_ARTIFACT_DIR=$DSO_ARTIFACT_DIR" >> "$GITHUB_ENV"

      - name: Compute cross-branch file set from DSO-Story-Merge trailers
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Parse DSO-Story-Merge trailers in the session PR to discover which
          # files were touched by ≥2 sub-branches (cross-branch file set).
          # Files appearing in ≥2 story PRs may have integration conflicts that
          # the per-branch review could not catch.
          CROSS_BRANCH_FILE="${DSO_ARTIFACT_DIR:-$RUNNER_TEMP/dso-review}/cross-branch-files.txt"
          declare -A story_file_sets
          # Enumerate session commits and extract DSO-Story-Merge trailers
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            commit_body="$(git log -1 --format=%B "$sha" 2>/dev/null)" || continue
            story_id="$(echo "$commit_body" | grep "^DSO-Story-Merge:" | head -1 | sed 's/^DSO-Story-Merge:[[:space:]]*//')" || true
            [[ -z "$story_id" ]] && continue
            # Collect files changed in this story branch merge commit.
            # bug 8a77 v2 Change E: use `-m` so merge commits (which `diff-tree`
            # without `-m` returns empty for) aren't silently dropped — same
            # follow-on as Change C below.
            changed_files="$(git diff-tree -m --no-commit-id --name-only -r "$sha" 2>/dev/null)" || true
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              story_file_sets["$f"]="${story_file_sets[$f]:-} $story_id"
            done <<< "$changed_files"
          done < <(git log "origin/${{ github.base_ref }}..HEAD" --format="%H" 2>/dev/null)
          # Emit files appearing in ≥2 story PRs
          : > "$CROSS_BRANCH_FILE"
          for f in "${!story_file_sets[@]}"; do
            story_list="${story_file_sets[$f]}"
            unique_count="$(echo "$story_list" | tr ' ' '\n' | grep -v '^$' | sort -u | wc -l | tr -d ' ')"
            if (( unique_count >= 2 )); then
              echo "$f" >> "$CROSS_BRANCH_FILE"
            fi
          done
          echo "Cross-branch files written to $CROSS_BRANCH_FILE"

      - name: Compute cross-branch file set via GitHub API (ci-pr fallback)
        # bug e349-6b4e-13c5-4e23: when DSO-Story-Merge trailers are absent
        # (ci-pr mode pre-Fix-D, or DSO_TRAILER_INJECTION_MODE=disabled),
        # derive the cross-branch file set from auto-merged story PRs via
        # the GitHub API. Verifies each PR's review-sub-pr check-run
        # conclusion is success before subtracting its files; otherwise
        # re-includes them in INTEGRATION_SCOPE for full review at integration tier.
        # Runs UNCONDITIONALLY alongside the trailer-grep step; the downstream
        # Union step dedups via sort -u.
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # F4 fix: gate on the full set of session-branch patterns from the
          # source-of-truth file (config/sub-pr-branch-patterns.txt under
          # the plugin root), not just the hardcoded ^worktree- prefix. The
          # prior gate silently no-op'd for session/foo, session_X,
          # bug-batch/Y, feat-*, story-*, fix-* head refs — those PRs fell
          # into the trailer-only path and could end up reviewing the full
          # session diff (defeating per-story decomposition).
          if ! bash plugins/dso/scripts/ci/match-session-branch.sh "$HEAD_REF"; then
            echo "Skipping API fallback: HEAD_REF=$HEAD_REF does not match any pattern in sub-pr-branch-patterns.txt"
            exit 0
          fi
          CROSS_BRANCH_FILE="${DSO_ARTIFACT_DIR:-$RUNNER_TEMP/dso-review}/cross-branch-files.txt"
          export CROSS_BRANCH_FILE
          bash plugins/dso/scripts/compute-cross-branch-from-api.sh

      - name: Union integration review scope
        if: needs.changes.outputs.code_changed == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${DSO_ARTIFACT_DIR:-$RUNNER_TEMP/dso-review}"
          UNPROVENANCED="${ARTIFACT_DIR}/unprovenanced-shas.txt"
          CROSS_BRANCH="${ARTIFACT_DIR}/cross-branch-files.txt"
          INTEGRATION_SCOPE="${ARTIFACT_DIR}/integration-scope-files.txt"
          : > "$INTEGRATION_SCOPE"
          # Collect files from unprovenanced commits.
          # bug 8a77 v2 Change C: `diff-tree -m` works for BOTH merge and
          # non-merge commits — forces diff generation against EACH parent and
          # emits the union (later deduped via `sort -u` below). For GitHub's
          # synthesized refs/pull/N/merge, the first parent is the base tip so
          # the output is the PR's contribution. Without `-m`, merge commits
          # silently produce empty output and the SHA is dropped from
          # INTEGRATION_SCOPE (bug 8a77 follow-on).
          if [[ -s "$UNPROVENANCED" ]]; then
            while IFS= read -r sha; do
              [[ -z "$sha" ]] && continue
              git diff-tree -m --no-commit-id --name-only -r "$sha" 2>/dev/null \
                >> "$INTEGRATION_SCOPE" || true
            done < "$UNPROVENANCED"
          fi
          # Union with cross-branch files
          if [[ -s "$CROSS_BRANCH" ]]; then
            cat "$CROSS_BRANCH" >> "$INTEGRATION_SCOPE"
          fi
          # Deduplicate
          sort -u "$INTEGRATION_SCOPE" -o "$INTEGRATION_SCOPE"
          SCOPE_COUNT="$(wc -l < "$INTEGRATION_SCOPE" | tr -d ' ')"
          echo "INTEGRATION_SCOPE_FILE=$INTEGRATION_SCOPE" >> "$GITHUB_ENV"
          echo "INTEGRATION_SCOPE_COUNT=$SCOPE_COUNT" >> "$GITHUB_ENV"
          echo "Integration scope: $SCOPE_COUNT file(s)"
          if [[ "$SCOPE_COUNT" -eq 0 ]]; then
            echo "INTEGRATION_SCOPE_EMPTY=true" >> "$GITHUB_ENV"
            # bug 1624-5fb9: prior log line said "skipping LLM review dispatch".
            # That was true under the kill-switch behavior introduced in
            # 9a4847206b. Since the fix in PR #188 the Run LLM review step
            # falls through to the full PR diff when the scope is empty —
            # the log line was misleading operators into believing review
            # was skipped when it now runs.
            echo "Integration scope empty — Run LLM review will dispatch against the full PR diff (direct-PR path)"
            # bug db71-e078-ec99-4fbf: an empty integration scope on a
            # multi-commit session PR is a signal that DSO-Story-Merge
            # trailers are missing — likely a Phase F bypass. Delegate the
            # warning emission to emit-missing-trailer-warning.sh so the
            # behavior is exercised by a behavioral test (cycle-2 llm-review
            # findings 2/4 and 3/4): the helper surfaces git failures
            # explicitly rather than swallowing them via 2>/dev/null.
            EVENT_NAME="${EVENT_NAME}" BASE_REF="${BASE_REF}" HEAD_REF="${HEAD_REF}" \
              SCOPE_EMPTY=true \
              bash plugins/dso/scripts/emit-missing-trailer-warning.sh
          else
            echo "INTEGRATION_SCOPE_EMPTY=false" >> "$GITHUB_ENV"
            echo "Integration scope populated — Run LLM review may narrow to integration-scope files via runner hints"
          fi

      - name: Compute DSO_REVIEW_CYCLE
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${GITHUB_REF#refs/pull/}"
          PR_NUMBER="${PR_NUMBER%/merge}"
          # Count finding-1 headers in issue-level comments (fallback posting path).
          PRIOR_ISSUE=$(gh pr view "$PR_NUMBER" --json comments \
            -q '[.comments[] | .body | select(test("^## DSO llm-review — finding 1/"))] | length' \
            2>/dev/null || echo 0)
          [[ "$PRIOR_ISSUE" =~ ^[0-9]+$ ]] || PRIOR_ISSUE=0
          # Count finding-1 headers in PR review-thread comments (primary posting path
          # via Pulls Reviews API). These are NOT returned by --json comments above.
          # --paginate without -q to avoid per-page jq output; jq -s flattens all pages
          PRIOR_REVIEW=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" --paginate \
            2>/dev/null \
            | jq -s '[.[].[] | .body | select(test("^## DSO llm-review — finding 1/"))] | length' \
            || echo 0)
          [[ "$PRIOR_REVIEW" =~ ^[0-9]+$ ]] || PRIOR_REVIEW=0
          PRIOR_CYCLES=$((PRIOR_ISSUE + PRIOR_REVIEW))
          CURRENT_CYCLE=$((PRIOR_CYCLES + 1))
          echo "DSO_REVIEW_CYCLE=$CURRENT_CYCLE" >> "$GITHUB_ENV"
          echo "Computed DSO_REVIEW_CYCLE=$CURRENT_CYCLE (issue=$PRIOR_ISSUE review=$PRIOR_REVIEW)"
          # Compute integration-review DSO_REVIEW_CYCLE separately so the integration
          # review uses its own cycle counter, not the per-branch review cycle counter.
          # integration-review DSO_REVIEW_CYCLE: use PR review history specific to the
          # session→main integration review (distinguished by "integration review" label).
          PRIOR_INTEGRATION=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" --paginate \
            2>/dev/null \
            | jq -s '[.[].[] | .body | select(test("integration.*review.*cycle|DSO_INTEGRATION_REVIEW_CYCLE"))] | length' \
            || echo 0)
          [[ "$PRIOR_INTEGRATION" =~ ^[0-9]+$ ]] || PRIOR_INTEGRATION=0
          DSO_INTEGRATION_REVIEW_CYCLE=$((PRIOR_INTEGRATION + 1))
          echo "DSO_INTEGRATION_REVIEW_CYCLE=$DSO_INTEGRATION_REVIEW_CYCLE" >> "$GITHUB_ENV"
          echo "Computed DSO_INTEGRATION_REVIEW_CYCLE=$DSO_INTEGRATION_REVIEW_CYCLE"

      - name: Suppress prior defenses for integration review
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          # Integration review suppresses TrackerDefenseStore defenses from
          # prior review cycles, preventing already-defended findings from being
          # re-flagged in the integration review pass.
          #
          # DSO_SUPPRESS_PRIOR_DEFENSES=true is read by runner.py:
          # when set, prior defenses are NOT loaded on cycle_number >= 2,
          # so the integration review sees the full unfiltered finding set
          # from the session's sub-PR review history. Consumer wired in T10
          # (story 0aed-4d7a-991d-4f7f).
          echo "DSO_SUPPRESS_PRIOR_DEFENSES=true" >> "$GITHUB_ENV"
          echo "suppress-prior-defenses: env var set — runner.py consumer active (T10)"

      - name: Run LLM review (provenance-aware)
        # S3.T3: replaces direct ci-llm-review-runner.sh invocation with the
        # provenance-aware wrapper. The wrapper calls verify-session-provenance.sh
        # and routes: exit 0 → skip (all provenanced), exit 3 → skip (OVER_BOUND),
        # exit 1|2 → invoke ci-llm-review-runner.sh (full-diff path).
        # bug 1624-5fb9: gate removed (was `&& env.INTEGRATION_SCOPE_EMPTY != 'true'`).
        # The pre-9a4847206b contract was that every code-changing PR receives an
        # LLM review against its full diff. The integration-scope narrowing —
        # designed to focus the review on cross-branch concerns for sprint-flow
        # PRs — became a kill-switch for every direct PR (29 merged without
        # review). Falling back to the full PR diff when the integration scope
        # is empty restores the original contract while keeping the scope vars
        # available as enrichment hints for the runner.
        if: needs.changes.outputs.code_changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_PLUGIN_ROOT: "${{ github.workspace }}/plugins/dso"
          # DSO_REVIEW_CYCLE is set via $GITHUB_ENV by the preceding step and
          # automatically propagated to subsequent step env contexts.
          DSO_REVIEW_CYCLE: ${{ env.DSO_REVIEW_CYCLE }}
          DSO_INTEGRATION_REVIEW_CYCLE: ${{ env.DSO_INTEGRATION_REVIEW_CYCLE }}
          DSO_SUPPRESS_PRIOR_DEFENSES: ${{ env.DSO_SUPPRESS_PRIOR_DEFENSES }}
          # c131-0f34: persist the runner's findings JSON so the liveness step
          # below can assert it exists and is well-formed. Without this, the
          # runner writes to stdout only and the gating job has no artifact to
          # inspect — a regression in the runner could silently exit 0.
          DSO_CI_REVIEW_OUTPUT_PATH: ${{ env.DSO_CI_REVIEW_FINDINGS_PATH }}
          # S3.T3: provenance range — read by verify-session-provenance.sh
          # (called internally by the wrapper). Uses PR event SHAs so the
          # verifier always receives concrete commit hashes.
          DSO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DSO_SESSION_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        id: llm_review_dispatch
        # R4 (bug f148 PR-C): capture the dispatcher's exit code without
        # failing the step. The Classify step below decides whether the
        # job should fail and emits the correct annotation ("infrastructure
        # failure" vs "review found problems"). Without this capture, the
        # step's set -e would mask the distinction.
        shell: bash {0}
        run: |
          set -o pipefail
          bash plugins/dso/scripts/llm-review-dispatch-or-skip.sh
          _rc=$?
          echo "exit_code=${_rc}" >> "$GITHUB_OUTPUT"
          # Always exit 0 here so the Classify step gets a chance to run.
          # The Classify step fails the job with the correct annotation.
          exit 0

      - name: Classify llm-review failure
        # R4 (bug f148 PR-C): read the dispatcher's exit code and emit
        # the right operator annotation. Exit 4 means "infrastructure
        # failure" — no valid review content produced. Exit non-zero
        # otherwise means "review found problems" — real critical/important
        # findings in the diff. Exit 0 is the happy path.
        #
        # Rollback: set DSO_INFRA_EXIT_CODE_ENABLED=0 in the dispatcher
        # step's env to disable exit-4 emission. The runner then returns
        # 1 for all failure modes (legacy behavior) and this step degrades
        # to a single "review found problems" annotation.
        if: always() && needs.changes.outputs.code_changed == 'true'
        shell: bash -eo pipefail {0}
        run: |
          _rc="${{ steps.llm_review_dispatch.outputs.exit_code }}"
          if [[ -z "${_rc}" ]]; then
            echo "::error::llm-review-dispatch-or-skip.sh produced no exit_code output — dispatch step itself crashed before reporting"
            exit 1
          fi
          case "${_rc}" in
            0)
              echo "llm-review passed (exit 0)"
              exit 0
              ;;
            4)
              echo "::error::llm-review infrastructure failure (exit 4) — no valid review content produced. Common causes: LLM provider outage, missing API key, all specialists crashed, all findings synthetic. NOT a real code-review finding. See plugins/dso/docs/contracts/review-defenses.md."
              exit 4
              ;;
            *)
              # Exit non-zero with code != 4. Most commonly this is exit 1 from
              # the severity gate (real blocking findings) or arbiter ruling.
              # Other paths (OVER_BOUND, schema-correction exhaustion) also
              # return non-zero. Keep the annotation neutral so operators read
              # the findings JSON / stderr rather than trusting the headline.
              echo "::error::llm-review failed (exit ${_rc}) — see findings JSON and stderr above. Likely a blocking finding from the severity gate; may also be an OVER_BOUND admin route or schema-correction exhaustion."
              exit "${_rc}"
              ;;
          esac

      - name: Assert review liveness
        # F3 fix: the prior gate (`if: code_changed == 'true'`) made this
        # safety net invisible when the upstream classifier said "no
        # reviewable changes" — the very class of regression it was
        # designed to catch (a bug or allowlist drift in skip-review-check.sh
        # that lets reviewable code through with `code_changed=false`).
        #
        # Run unconditionally and trust-but-verify:
        #   - code_changed=true → assert findings.json exists and is valid
        #     (prior behavior).
        #   - code_changed=false → re-run skip-review-check.sh on the
        #     actual PR diff and confirm the upstream "all allowlisted"
        #     classification. If it disagrees, fail loud.
        shell: bash -eo pipefail {0}
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          DSO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DSO_SESSION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bash plugins/dso/scripts/ci/assert-review-liveness.sh

  # ── Merge-pipeline checks (umbrella) ─────────────────────────────────────
  # Stable required-check context for branch protection. This job always runs
  # and always reports a result on the stable "merge-pipeline-checks" name.
  # The red-test-blocker step fires only when a session branch targets main.

  merge-pipeline-checks:
    name: merge-pipeline-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Run on pull_request events targeting session branches or main.
    if: |
      github.event_name == 'pull_request' && (
        github.base_ref == 'main' ||
        startsWith(github.base_ref, 'session/') ||
        startsWith(github.base_ref, 'session-') ||
        startsWith(github.base_ref, 'session_') ||
        startsWith(github.base_ref, 'bug-batch/') ||
        startsWith(github.base_ref, 'worktree-')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Capture SHAs at job-start into env to avoid race conditions
      # with concurrent pushes that might update the branch after the
      # workflow starts (bug a794-e908-6ae8-4516 gap-analysis #3).
      - name: Capture PR SHAs
        id: capture-shas
        run: |
          echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
          echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          echo "Captured BASE_SHA=${{ github.event.pull_request.base.sha }}"
          echo "Captured HEAD_SHA=${{ github.event.pull_request.head.sha }}"

      # red-test-blocker: scan the merged .test-index for RED markers.
      # Only fires when PR base == main AND head matches a session or bug-batch pattern.
      # When the conditional does not fire, this step is a no-op success (umbrella
      # still reports success on the stable check-context name).
      - name: red-test-blocker
        if: |
          github.base_ref == 'main' && (
            startsWith(github.head_ref, 'session/') ||
            startsWith(github.head_ref, 'session-') ||
            startsWith(github.head_ref, 'session_') ||
            startsWith(github.head_ref, 'bug-batch/') ||
            startsWith(github.head_ref, 'worktree-') ||
            startsWith(github.head_ref, 'fix-')
          )
        run: |
          set -euo pipefail
          echo "Scanning merged .test-index for RED markers (base=$BASE_SHA head=$HEAD_SHA)"
          bash plugins/dso/scripts/scan-red-markers.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Job timing report
        if: always()
        run: echo "merge-pipeline-checks completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
