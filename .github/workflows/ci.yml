# Digital Service Orchestra (DSO) — Continuous Integration
# Runs shellcheck, Python linting, and plugin tests.

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'epic/**'
      - 'exp/**'
      # NOTE: 'story/**' intentionally NOT included here. Story branches
      # always have an open PR; the pull_request trigger below covers them.
      # Adding push:story/** would duplicate every CI job per push (push +
      # pull_request fire at the same time on different github.ref values,
      # so concurrency.group does not dedupe them). Discovered post-3914.
  pull_request:
    # PRs targeting any branch run the full CI suite. Previously this was
    # restricted to PRs targeting main, which meant per-story PRs (head=story/X,
    # base=session_branch=story/Y) skipped ALL CI tests — only per-branch-
    # review.yml's LLM check ran. Removing the branches filter makes ci.yml run
    # on every PR regardless of base. Bug 3914-0848-faad-4f6a.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Path-change detection ───────────────────────────────────
  # Mirrors the local review-gate skip logic by invoking
  # plugins/dso/scripts/skip-review-check.sh — the SAME script used by
  # COMMIT-WORKFLOW.md Step 0.5 to decide whether a local commit can skip
  # review. This eliminates the divergence that allowed PR #66 to merge
  # silently: the prior `.md`-blanket exclude let CLAUDE.md and skill .md
  # changes skip tests entirely, even though those files affect agent
  # behavior and ARE classified as reviewable by the local gate.
  #
  # skip-review-check.sh classifies a file list (one file per line on stdin):
  #   exit 0 → SKIP_REVIEW=true  (all files allowlisted, e.g. tickets, images,
  #                                lockfiles); CI can skip downstream tests.
  #   exit 1 → SKIP_REVIEW=false (at least one reviewable file: CLAUDE.md,
  #                                hooks/, skills/, docs/workflows/, or any
  #                                file not matched by review-gate-allowlist.conf);
  #                                CI MUST run downstream tests.
  #
  # DSO_FORCE_LOCAL_REVIEW=1 disables skip-review-check.sh's
  # dso.workflow=ci-pr short-circuit (which is intended for the local
  # pipeline, NOT for CI itself).
  #
  # Bug f776-d7ef: PR #66 merged with green CI because the prior `.md`-only
  # filter classified its 8 .md changes as code_changed=false. Hook/Script/
  # Python tests then "ran" in 4-5s (no-op) and reported SUCCESS — but the
  # underlying tests would have failed (and did, on the post-merge push event).
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect reviewable changes (mirrors local review-gate)
        id: filter
        run: |
          set -euo pipefail
          # Non-PR events (push, workflow_dispatch) always run the full pipeline.
          # Short-circuit before computing the diff to avoid sentinel-string fragility.
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "Event ${GITHUB_EVENT_NAME}: forcing code_changed=true"
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_REF="origin/${{ github.base_ref }}"
          # Verify BASE_REF is fetched before computing the diff. fetch-depth: 0
          # on actions/checkout@v4 fetches all refs; this guard fails loud rather
          # than silent if the runner's checkout shape ever changes.
          if ! git rev-parse --verify --quiet "$BASE_REF" >/dev/null; then
            echo "ERROR: base ref ${BASE_REF} not found in local refs after checkout. Forcing code_changed=true to be safe." >&2
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_REF...HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          # Verify the local review-gate skip script is present. Fail-loud if
          # absent rather than silently falling back to the broken `.md`-only
          # heuristic (the very gap that landed PR #66 with broken tests).
          SKIP_SCRIPT="plugins/dso/scripts/skip-review-check.sh"
          if [[ ! -x "$SKIP_SCRIPT" ]]; then
            echo "ERROR: ${SKIP_SCRIPT} not found or not executable. Forcing code_changed=true to be safe." >&2
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Run the same classifier the local review gate uses.
          # exit 0 → all files allowlisted (tests can skip)
          # exit 1 → at least one reviewable file (tests MUST run)
          # DSO_FORCE_LOCAL_REVIEW=1 disables the dso.workflow=ci-pr
          # short-circuit (we ARE the CI; that short-circuit would no-op us).
          set +e
          echo "$CHANGED" | DSO_FORCE_LOCAL_REVIEW=1 bash "$SKIP_SCRIPT"
          SKIP_RC=$?
          set -e
          if [[ "$SKIP_RC" -eq 0 ]]; then
            echo "skip-review-check: all changes allowlisted — code_changed=false"
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$SKIP_RC" -eq 1 ]]; then
            echo "skip-review-check: reviewable changes detected — code_changed=true"
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: skip-review-check.sh exited ${SKIP_RC} (expected 0 or 1). Forcing code_changed=true to be safe." >&2
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Fast gates ──────────────────────────────────────────────

  actionlint:
    name: Actionlint
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run actionlint
        if: needs.changes.outputs.code_changed == 'true'
        run: actionlint -color

      - name: Job timing report
        if: always()
        run: echo "actionlint completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  shellcheck:
    name: ShellCheck
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        # Download from GitHub releases instead of apt to avoid azure.archive.ubuntu.com
        # DNS outages on Azure-hosted runners (saw 3 consecutive cancellations 2026-05-02).
        # github.com DNS is independent of the apt repo mirrors.
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          set -euo pipefail
          SHELLCHECK_VERSION=v0.10.0
          TARBALL="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 \
                "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${TARBALL}" \
                -o "${TARBALL}"; then
              break
            fi
            echo "Download attempt ${attempt} failed; retrying..." >&2
            sleep 10
          done
          tar -xJf "${TARBALL}"
          sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          rm -rf "shellcheck-${SHELLCHECK_VERSION}" "${TARBALL}"
          shellcheck --version

      - name: Run shellcheck
        if: needs.changes.outputs.code_changed == 'true'
        run: shellcheck --severity=warning plugins/dso/scripts/*.sh plugins/dso/hooks/*.sh plugins/dso/hooks/**/*.sh

      - name: Job timing report
        if: always()
        run: echo "shellcheck completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  lint-python:
    name: Lint Python (ruff)
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        if: needs.changes.outputs.code_changed == 'true'
        run: pip install ruff

      - name: Ruff check
        if: needs.changes.outputs.code_changed == 'true'
        run: ruff check plugins/dso/scripts/*.py tests/**/*.py

      - name: Ruff format check
        if: needs.changes.outputs.code_changed == 'true'
        run: ruff format --check plugins/dso/scripts/*.py tests/**/*.py

      - name: Job timing report
        if: always()
        run: echo "lint-python completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # ── Full test suite ─────────────────────────────────────────

  test-hooks:
    name: Hook Tests
    needs: [changes, shellcheck, lint-python]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUITE_TEST_INDEX: ${{ github.workspace }}/.test-index
    steps:
      - uses: actions/checkout@v4

      - name: Run hook tests
        if: needs.changes.outputs.code_changed == 'true'
        run: bash tests/hooks/run-hook-tests.sh

      - name: Job timing report
        if: always()
        run: echo "test-hooks completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  test-scripts:
    name: Script Tests
    needs: [changes, shellcheck, lint-python]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUITE_TEST_INDEX: ${{ github.workspace }}/.test-index
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        if: needs.changes.outputs.code_changed == 'true'
        run: pip install ruff pyyaml jsonschema

      - name: Install hyperfine
        if: needs.changes.outputs.code_changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y hyperfine

      - name: Verify hyperfine installed
        if: needs.changes.outputs.code_changed == 'true'
        run: hyperfine --version

      - name: Run script tests
        if: needs.changes.outputs.code_changed == 'true'
        run: bash tests/scripts/run-script-tests.sh

      - name: Job timing report
        if: always()
        run: echo "test-scripts completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  validate-required-checks:
    name: Validate required-checks.txt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Validate check-context names
        run: bash plugins/dso/scripts/onboarding/validate-required-checks.sh

  # ── Mirror tracker defenses to PR ───────────────────────────

  mirror-defenses-to-pr:
    name: Mirror Tracker Defenses to PR
    needs: [changes, test-hooks, test-scripts]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Mirror defenses to PR
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Producer: review-defense-store.sh list scans the tickets orphan branch
        # for all stored DEFENSE_RECORD entries and emits them on stdout (one per
        # line in "DEFENSE_RECORD: <json>" form). mirror-defenses-to-pr.sh reads
        # those lines from stdin and posts each as a PR comment.
        # Bug cluster RC-A: this step used to invoke mirror-defenses-to-pr.sh
        # with no stdin producer, so its `while read -r line` loop received
        # nothing and the CI defense-suppression pipeline was a no-op.
        run: |
          PR_NUMBER="${GITHUB_REF#refs/pull/}"
          PR_NUMBER="${PR_NUMBER%/merge}"
          # Ensure the tickets ref is fetched so review-defense-store.sh list
          # can read DEFENSE_RECORD comments from it. actions/checkout@v4 does
          # not fetch the orphan tickets branch by default.
          git fetch --no-tags origin '+refs/heads/tickets:refs/remotes/origin/tickets' 2>/dev/null || true
          bash plugins/dso/scripts/review-defense-store.sh list --pr "$PR_NUMBER" \
            | bash plugins/dso/scripts/mirror-defenses-to-pr.sh "$PR_NUMBER" || true

  # ── LLM code review ─────────────────────────────────────────

  llm-review:
    needs: [changes, test-hooks, test-scripts, mirror-defenses-to-pr]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      # REVIEW-DEFENSE: id-token: write is intentionally absent. Adding it would trigger
      # the claude-code-action OIDC app-token exchange, which validates the workflow file
      # is identical to the main branch as a security check. Any PR that modifies ci.yml
      # (including this one) fails that check with 401 Unauthorized. The action authenticates
      # via ANTHROPIC_API_KEY (direct API key auth) and does not need OIDC.
    steps:
      - uses: actions/checkout@v4

      - name: Install litellm
        if: needs.changes.outputs.code_changed == 'true'
        run: pip install litellm==1.83.7

      - name: Smoke-test review-complexity-classifier.sh
        if: needs.changes.outputs.code_changed == 'true'
        env:
          CLAUDE_PLUGIN_ROOT: "${{ github.workspace }}/plugins/dso"
        run: |
          set -euo pipefail
          FIXTURE="tests/fixtures/ci-review-corpus/fixture-diff.txt"
          if [[ -f "$FIXTURE" ]]; then
            DIFF_FILE="$FIXTURE"
          else
            echo 'No fixture diff found — generating minimal synthetic diff'
            DIFF_FILE=$(mktemp /tmp/smoke-test-diff.XXXXXX)
            printf '+foo\n-bar\n' > "$DIFF_FILE"
          fi
          OUTPUT=$(bash plugins/dso/scripts/review-complexity-classifier.sh < "$DIFF_FILE")
          echo "$OUTPUT" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("selected_tier") in {"light","standard","deep"}, f"invalid: {d}"'
          echo "Smoke test passed: $OUTPUT"

      # Compute the current llm-review cycle number by counting prior
      # "## DSO llm-review — finding 1/N" headers across both posting paths:
      #   - Issue comments (gh pr comment fallback path — no cited_lines anchor)
      #   - PR review-thread comments (primary path — Pulls Reviews API, bug 59e3-8b8b fix)
      # Each prior cycle posts exactly one finding-1 header regardless of path,
      # so the union count equals the number of prior cycles. PRIOR + 1 gives the
      # current cycle. Exported via $GITHUB_ENV so runner.py cycle_number gate
      # (runner.py:789) sees the real value — without this, every cycle>=2
      # suppression branch was structurally disabled.
      # ── Integration review scope: narrow scope for session→main PRs ──────────
      # Steps below identify only the files that need integration-level review:
      #   1. Un-provenanced commits (not traced to any story PR)
      #   2. Cross-branch files (changed in ≥2 story PRs — potential conflicts)
      # If both sets are empty, the integration review is skipped (scope empty).

      - name: Verify session provenance
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSO_ARTIFACT_DIR: ${{ runner.temp }}/dso-review
        run: |
          set -euo pipefail
          mkdir -p "$DSO_ARTIFACT_DIR"
          # Ensure the base ref is fetched before computing the provenance range.
          # The pull_request checkout is shallow and does not guarantee
          # origin/${base_ref} is locally available; without an explicit fetch,
          # the script's range-collapse error gets suppressed and unprovenanced
          # commits are silently missed (Copilot/CodeRabbit finding 2026-05-16).
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" 2>/dev/null || true
          # verify-session-provenance.sh writes unprovenanced-shas.txt and exits
          # 0 (all provenanced), 1 (some unprovenanced), or 2 (budget exhausted).
          # We continue regardless — failures feed into the integration scope.
          # NOTE: the script reads DSO_BASE_SHA / DSO_SESSION_HEAD from env;
          # it does NOT parse CLI flags. Passing --base-ref silently no-ops.
          DSO_BASE_SHA="origin/${{ github.base_ref }}" \
            bash plugins/dso/scripts/verify-session-provenance.sh \
            2>/dev/null || true
          echo "DSO_ARTIFACT_DIR=$DSO_ARTIFACT_DIR" >> "$GITHUB_ENV"

      - name: Compute cross-branch file set from DSO-Story-Merge trailers
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Parse DSO-Story-Merge trailers in the session PR to discover which
          # files were touched by ≥2 sub-branches (cross-branch file set).
          # Files appearing in ≥2 story PRs may have integration conflicts that
          # the per-branch review could not catch.
          CROSS_BRANCH_FILE="${DSO_ARTIFACT_DIR:-$RUNNER_TEMP/dso-review}/cross-branch-files.txt"
          declare -A story_file_sets
          # Enumerate session commits and extract DSO-Story-Merge trailers
          while IFS= read -r sha; do
            [[ -z "$sha" ]] && continue
            commit_body="$(git log -1 --format=%B "$sha" 2>/dev/null)" || continue
            story_id="$(echo "$commit_body" | grep "^DSO-Story-Merge:" | head -1 | sed 's/^DSO-Story-Merge:[[:space:]]*//')" || true
            [[ -z "$story_id" ]] && continue
            # Collect files changed in this story branch merge commit
            changed_files="$(git diff-tree --no-commit-id -r --name-only "$sha" 2>/dev/null)" || true
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              story_file_sets["$f"]="${story_file_sets[$f]:-} $story_id"
            done <<< "$changed_files"
          done < <(git log "origin/${{ github.base_ref }}..HEAD" --format="%H" 2>/dev/null)
          # Emit files appearing in ≥2 story PRs
          : > "$CROSS_BRANCH_FILE"
          for f in "${!story_file_sets[@]}"; do
            story_list="${story_file_sets[$f]}"
            unique_count="$(echo "$story_list" | tr ' ' '\n' | grep -v '^$' | sort -u | wc -l | tr -d ' ')"
            if (( unique_count >= 2 )); then
              echo "$f" >> "$CROSS_BRANCH_FILE"
            fi
          done
          echo "Cross-branch files written to $CROSS_BRANCH_FILE"

      - name: Union integration review scope
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${DSO_ARTIFACT_DIR:-$RUNNER_TEMP/dso-review}"
          UNPROVENANCED="${ARTIFACT_DIR}/unprovenanced-shas.txt"
          CROSS_BRANCH="${ARTIFACT_DIR}/cross-branch-files.txt"
          INTEGRATION_SCOPE="${ARTIFACT_DIR}/integration-scope-files.txt"
          : > "$INTEGRATION_SCOPE"
          # Collect files from unprovenanced commits
          if [[ -s "$UNPROVENANCED" ]]; then
            while IFS= read -r sha; do
              [[ -z "$sha" ]] && continue
              git diff-tree --no-commit-id -r --name-only "$sha" 2>/dev/null \
                >> "$INTEGRATION_SCOPE" || true
            done < "$UNPROVENANCED"
          fi
          # Union with cross-branch files
          if [[ -s "$CROSS_BRANCH" ]]; then
            cat "$CROSS_BRANCH" >> "$INTEGRATION_SCOPE"
          fi
          # Deduplicate
          sort -u "$INTEGRATION_SCOPE" -o "$INTEGRATION_SCOPE"
          SCOPE_COUNT="$(wc -l < "$INTEGRATION_SCOPE" | tr -d ' ')"
          echo "INTEGRATION_SCOPE_FILE=$INTEGRATION_SCOPE" >> "$GITHUB_ENV"
          echo "INTEGRATION_SCOPE_COUNT=$SCOPE_COUNT" >> "$GITHUB_ENV"
          echo "Integration scope: $SCOPE_COUNT file(s)"
          if [[ "$SCOPE_COUNT" -eq 0 ]]; then
            echo "INTEGRATION_SCOPE_EMPTY=true" >> "$GITHUB_ENV"
            echo "Integration scope empty: no files to review — skipping LLM review dispatch"
          else
            echo "INTEGRATION_SCOPE_EMPTY=false" >> "$GITHUB_ENV"
          fi

      - name: Compute DSO_REVIEW_CYCLE
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${GITHUB_REF#refs/pull/}"
          PR_NUMBER="${PR_NUMBER%/merge}"
          # Count finding-1 headers in issue-level comments (fallback posting path).
          PRIOR_ISSUE=$(gh pr view "$PR_NUMBER" --json comments \
            -q '[.comments[] | .body | select(test("^## DSO llm-review — finding 1/"))] | length' \
            2>/dev/null || echo 0)
          [[ "$PRIOR_ISSUE" =~ ^[0-9]+$ ]] || PRIOR_ISSUE=0
          # Count finding-1 headers in PR review-thread comments (primary posting path
          # via Pulls Reviews API). These are NOT returned by --json comments above.
          # --paginate without -q to avoid per-page jq output; jq -s flattens all pages
          PRIOR_REVIEW=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" --paginate \
            2>/dev/null \
            | jq -s '[.[].[] | .body | select(test("^## DSO llm-review — finding 1/"))] | length' \
            || echo 0)
          [[ "$PRIOR_REVIEW" =~ ^[0-9]+$ ]] || PRIOR_REVIEW=0
          PRIOR_CYCLES=$((PRIOR_ISSUE + PRIOR_REVIEW))
          CURRENT_CYCLE=$((PRIOR_CYCLES + 1))
          echo "DSO_REVIEW_CYCLE=$CURRENT_CYCLE" >> "$GITHUB_ENV"
          echo "Computed DSO_REVIEW_CYCLE=$CURRENT_CYCLE (issue=$PRIOR_ISSUE review=$PRIOR_REVIEW)"
          # Compute integration-review DSO_REVIEW_CYCLE separately so the integration
          # review uses its own cycle counter, not the per-branch review cycle counter.
          # integration-review DSO_REVIEW_CYCLE: use PR review history specific to the
          # session→main integration review (distinguished by "integration review" label).
          PRIOR_INTEGRATION=$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments" --paginate \
            2>/dev/null \
            | jq -s '[.[].[] | .body | select(test("integration.*review.*cycle|DSO_INTEGRATION_REVIEW_CYCLE"))] | length' \
            || echo 0)
          [[ "$PRIOR_INTEGRATION" =~ ^[0-9]+$ ]] || PRIOR_INTEGRATION=0
          DSO_INTEGRATION_REVIEW_CYCLE=$((PRIOR_INTEGRATION + 1))
          echo "DSO_INTEGRATION_REVIEW_CYCLE=$DSO_INTEGRATION_REVIEW_CYCLE" >> "$GITHUB_ENV"
          echo "Computed DSO_INTEGRATION_REVIEW_CYCLE=$DSO_INTEGRATION_REVIEW_CYCLE"

      - name: Suppress prior defenses for integration review
        if: needs.changes.outputs.code_changed == 'true'
        run: |
          # Integration review must suppress TrackerDefenseStore defenses from prior
          # review cycles. The suppress-prior-defenses flag prevents already-defended
          # findings from being re-flagged in the integration review pass.
          echo "DSO_SUPPRESS_PRIOR_DEFENSES=true" >> "$GITHUB_ENV"
          echo "suppress-prior-defenses: enabled for integration review"

      - name: Run LLM review
        if: needs.changes.outputs.code_changed == 'true' && env.INTEGRATION_SCOPE_EMPTY != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_PLUGIN_ROOT: "${{ github.workspace }}/plugins/dso"
          # DSO_REVIEW_CYCLE is set via $GITHUB_ENV by the preceding step and
          # automatically propagated to subsequent step env contexts.
          DSO_REVIEW_CYCLE: ${{ env.DSO_REVIEW_CYCLE }}
          DSO_INTEGRATION_REVIEW_CYCLE: ${{ env.DSO_INTEGRATION_REVIEW_CYCLE }}
          DSO_SUPPRESS_PRIOR_DEFENSES: ${{ env.DSO_SUPPRESS_PRIOR_DEFENSES }}
        shell: bash -eo pipefail {0}
        run: |
          PR_NUMBER="${GITHUB_REF#refs/pull/}"
          PR_NUMBER="${PR_NUMBER%/merge}"
          # If integration scope is empty, skip LLM review dispatch entirely.
          if [[ "${INTEGRATION_SCOPE_EMPTY:-false}" == "true" ]]; then
            echo "Integration scope empty: no files to review — skipping LLM review"
            exit 0
          fi
          gh pr diff "$PR_NUMBER" | bash plugins/dso/scripts/ci-llm-review-runner.sh

