name: dangling-references

# W6 — symbol-level cross-sub-PR conflict check. Catches the P2 gap: a symbol
# removed/renamed in one change but still referenced at the combined staged head
# (in an untouched caller or another change's file) — invisible to diff-scoped
# review because the caller's file may have zero diff.
#
# ROLLOUT: MODE=warn (logs ::warning::, does not block) and NOT yet a required
# check. To enforce: flip DSO_DANGLING_MODE to `enforce`, add `dangling-references`
# to .github/required-checks.txt, and provision it into the live MAIN ruleset
# (admin). Until then it is advisory.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dangling-references:
    name: dangling-references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fd084cde189b7b76ec305d52e27be545a0172823  # v4
        with:
          fetch-depth: 0          # full history — the check fails closed on a shallow clone
          persist-credentials: false

      # The matcher uses `ast-grep` for comment/string-aware reference matching.
      # Install the real binary — on Linux bare `sg` is shadow-utils (a different
      # tool); without ast-grep the check silently falls back to git-grep (FPs).
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.43.0

      - name: Verify ast-grep installed
        run: ast-grep --version

      - name: Run dangling-reference check
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          DSO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # ROLLOUT KNOB — flip to `enforce` at go-live (see header).
          DSO_DANGLING_MODE: warn
        run: |
          set +e
          bash plugins/dso/scripts/ci/check-dangling-references.sh
          rc=$?
          # 78 = precondition not met (shallow clone / missing tooling). In WARN
          # mode (today's default) this maps to exit 0 with a ::warning so the
          # advisory check stays green. In ENFORCE mode the precondition is
          # fail-closed: a precondition failure MUST block rather than silently
          # green-stamp a candidate with an unresolved symbol reference. Default
          # is warn so live CI behavior is unchanged.
          bash plugins/dso/scripts/ci/precondition-gate.sh \
            "$rc" "${DSO_DANGLING_MODE:-warn}" "dangling-references"
