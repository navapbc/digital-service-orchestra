name: Sprint Story Review

on:
  push:
    branches:
      - 'story/**'

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ vars.SPRINT_SESSION_ID }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './plugins/dso/scripts'
          # warning: suppress info/style-level findings (SC2295, SC2086, SC2016, etc.)
          # that are pre-existing and non-actionable. Only actual warnings+ block CI.
          severity: warning

  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check plugins/dso/scripts/

  mirror-tracker-defenses:
    name: Mirror Tracker Defenses to PR
    needs: [actionlint, shellcheck, lint-python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Mirror defenses to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "No open PR found for branch ${GITHUB_REF_NAME} — skipping defense mirror"
            exit 0
          fi
          # Fetch tickets orphan branch so review-defense-store.sh can read DEFENSE_RECORD entries.
          git fetch --no-tags origin '+refs/heads/tickets:refs/remotes/origin/tickets' 2>/dev/null || true
          bash plugins/dso/scripts/review-defense-store.sh list --pr "$PR_NUMBER" \
            | bash plugins/dso/scripts/mirror-defenses-to-pr.sh "$PR_NUMBER" || true

  review:
    name: Per-Story LLM Review
    needs: [actionlint, shellcheck, lint-python, mirror-tracker-defenses]
    runs-on: ubuntu-latest
    # 30 min: region-split mode with 5 clusters takes ~12 min; 30 provides headroom.
    timeout-minutes: 30
    steps:
      - name: Checkout story branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sanitize artifact name
        run: |
          SAFE_NAME="${GITHUB_REF_NAME//\//-}"
          echo "ARTIFACT_NAME=sprint-story-review-${SAFE_NAME}" >> "$GITHUB_ENV"

      - name: Fetch session branch
        env:
          SPRINT_SESSION_ID: ${{ vars.SPRINT_SESSION_ID }}
        run: git fetch origin "${SPRINT_SESSION_ID:-main}"

      - name: Compute story diff (merge-base delta)
        env:
          SPRINT_SESSION_ID: ${{ vars.SPRINT_SESSION_ID }}
        run: |
          BASE=$(git merge-base "origin/${SPRINT_SESSION_ID:-main}" HEAD)
          git diff "$BASE" HEAD > /tmp/story-diff.patch

      - name: Download prior review artifact (cycle tracking)
        # actions/download-artifact@v4 is intentionally NOT used here: it scopes artifact
        # lookup to the current run-id (even with github-token set), which makes it
        # impossible to download artifacts from a prior run. We need cross-run download to
        # retrieve the cycle N findings.json so cycle N+1 can build on prior defenses.
        # This gh api + curl approach is the only mechanism that supports cross-run lookup.
        # continue-on-error: true ensures a missing prior artifact (cycle 1) is non-fatal.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download from a PRIOR run (not the current run).
          # Filter out the current run-id so we get the most recent completed run's artifact.
          mkdir -p /tmp/prior-review
          # per_page=10: artifact names are branch-specific so accumulation is slow,
          # but 10 provides headroom without hitting API limits.
          ARTIFACT_URL=$(gh api \
            "/repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=10" \
            --jq ".artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .archive_download_url" \
            | head -1)
          if [[ -n "$ARTIFACT_URL" ]]; then
            # GitHub API download endpoints accept Bearer scheme (same as gh CLI internally).
            # -f: fail on HTTP errors (4xx/5xx) so a non-zip error response is not
            # silently passed to unzip as if it were a valid archive.
            curl -fsL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "$ARTIFACT_URL" -o /tmp/prior-review.zip && \
              unzip -o /tmp/prior-review.zip -d /tmp/prior-review/ && \
              echo "Downloaded prior artifact from $ARTIFACT_URL"
          else
            echo "No prior artifact found — cycle 1"
          fi

      - name: Install litellm
        # Pin to tested version; bump after verifying compatibility with ci-llm-review-runner.sh
        run: pip install litellm==1.83.7

      # Resolve PR number so runner.py can fetch DEFENSE_RECORD comments for cycle N≥2
      # suppression. push events don't expose github.event.pull_request.number, so we
      # use gh pr list to find the open PR for this branch.
      - name: Resolve PR number
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number \
            --jq '.[0].number' 2>/dev/null || echo "")
          if [[ "${PR_NUM}" =~ ^[0-9]+$ ]]; then
            echo "PR_NUMBER=${PR_NUM}" >> "$GITHUB_ENV"
            echo "Resolved PR_NUMBER=${PR_NUM}"
          else
            echo "No open PR found for branch ${GITHUB_REF_NAME} — defense suppression will be skipped"
          fi

      # Compute review cycle: each prior run uploads a story-diff artifact, but
      # the most reliable in-job signal here is the presence of the prior-review
      # artifact downloaded above. Read the prior cycle number from the
      # findings.json (runner.py writes `cycle_number` per cycle) and
      # increment. Falls back to cycle 1 when no artifact is present, and
      # to prior=1 (current=2) when the field is missing/unparseable.
      - name: Compute DSO_REVIEW_CYCLE
        run: |
          if [[ -s /tmp/prior-review/findings.json ]]; then
            # Read prior cycle_number from the artifact (runner.py writes
            # this field per cycle). Use jq because it parses single-line
            # safely without triggering YAML/bash quoting hazards. Falls
            # back to prior=1 on any parse error or missing field.
            PRIOR_CYCLE=$(jq -r '.cycle_number // 1' /tmp/prior-review/findings.json 2>/dev/null || echo 1)
            [[ "$PRIOR_CYCLE" =~ ^[0-9]+$ ]] || PRIOR_CYCLE=1
            CURRENT_CYCLE=$((PRIOR_CYCLE + 1))
            echo "DSO_REVIEW_CYCLE=$CURRENT_CYCLE" >> "$GITHUB_ENV"
            echo "Computed DSO_REVIEW_CYCLE=$CURRENT_CYCLE (prior cycle from artifact: $PRIOR_CYCLE)"
          else
            echo "DSO_REVIEW_CYCLE=1" >> "$GITHUB_ENV"
            echo "Computed DSO_REVIEW_CYCLE=1 (no prior-review artifact)"
          fi

      - name: Run LLM review
        run: bash plugins/dso/scripts/ci-llm-review-runner.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_PLUGIN_ROOT: "${{ github.workspace }}/plugins/dso"
          DSO_CI_REVIEW_DIFF_PATH: /tmp/story-diff.patch
          DSO_CI_REVIEW_PRIOR_DEFENSES_PATH: /tmp/prior-review/findings.json
          # Persist the runner's findings JSON so the NEXT cycle can read
          # cycle_number from it (see "Compute DSO_REVIEW_CYCLE" above) and
          # so DSO_CI_REVIEW_PRIOR_DEFENSES_PATH on the next run points at
          # a file that actually exists.
          DSO_CI_REVIEW_OUTPUT_PATH: /tmp/findings.json
          DSO_CI_REVIEW_DRY_RUN: ${{ vars.DSO_CI_REVIEW_DRY_RUN || '' }}
          DSO_REVIEW_CYCLE: ${{ env.DSO_REVIEW_CYCLE }}
          # PR_NUMBER enables runner.py defense suppression in push-triggered workflows.
          # Set by "Resolve PR number" step above; absent on branches without open PRs.
          PR_NUMBER: ${{ env.PR_NUMBER }}

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            /tmp/story-diff.patch
            /tmp/findings.json
          retention-days: 7
          if-no-files-found: warn
