# Digital Service Orchestra — Jira↔DSO Reconciler
#
# MERGE LAST — depends on dso_reconciler/__main__.py from PR 3 and bands from
# PR 4. This workflow MUST be merged after PRs 3 and 4 are on main; otherwise
# the reconciler invocation (`python -m dso_reconciler`) will fail because
# the package entry point will not exist on main.
#
# Runs the drift-healing reconciler on a ~20-minute cadence to keep the
# Jira mirror and the local ticket tracker in sync.
#
# Single-flight concurrency (cancel-in-progress: false) ensures a running
# reconciler completes before the next scheduled invocation starts.

name: Reconcile Bridge

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Reconciler rollout-safety mode (dry-run | bootstrap-strict | bootstrap-throttle | live | probe)'
        required: false
        default: 'live'
        type: choice
        options:
          - dry-run
          - bootstrap-strict
          - bootstrap-throttle
          - live
          - probe

concurrency:
  group: reconcile-bridge
  cancel-in-progress: false

jobs:
  reconcile:
    name: Run DSO reconciler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Validate BRIDGE_ENV_ID
        env:
          BRIDGE_ENV_ID: ${{ vars.BRIDGE_ENV_ID }}
        run: |
          if [ -z "$BRIDGE_ENV_ID" ]; then
            echo "::error::BRIDGE_ENV_ID is unset or empty. Set as a repo variable:"
            echo "  gh variable set BRIDGE_ENV_ID --body \"\$(uuidgen || python3 -c 'import uuid; print(uuid.uuid4())')\""
            exit 1
          fi

      - name: Validate reconciler entry point is present
        run: |
          # Pre-flight guard: this PR (cutover) MUST merge after PR 3 (reconciler
          # __main__.py) and PR 4 (bands). If either is missing, fail fast with
          # a clear message rather than letting `python -m dso_reconciler` emit
          # an opaque ModuleNotFoundError.
          if [ ! -f plugins/dso/scripts/dso_reconciler/__main__.py ]; then
            echo "::error::dso_reconciler/__main__.py is missing — PR 3 has not been merged to main yet. This workflow MUST merge after PR 3."
            exit 1
          fi

      - name: Mount tickets branch as worktree
        run: |
          git fetch origin tickets --depth=1
          # Remove the placeholder .tickets-tracker/ from main (if it exists)  # tickets-boundary-ok
          rm -rf .tickets-tracker  # tickets-boundary-ok
          git worktree add .tickets-tracker tickets  # tickets-boundary-ok

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: plugins/dso/scripts/requirements.lock

      - name: Install Python dependencies
        run: pip install -r plugins/dso/scripts/requirements.lock

      - name: Cache ACLI binary
        id: cache-acli
        uses: actions/cache@v4
        with:
          path: ~/.acli
          key: acli-${{ runner.os }}-${{ vars.ACLI_VERSION || 'latest' }}

      - name: Download + verify + install ACLI
        if: steps.cache-acli.outputs.cache-hit != 'true'
        env:
          ACLI_VERSION: ${{ vars.ACLI_VERSION }}
          ACLI_SHA256: ${{ vars.ACLI_SHA256 }}
        run: |
          if [ -z "$ACLI_VERSION" ] || [ "$ACLI_VERSION" = "latest" ]; then
            echo "::error::ACLI_VERSION repo variable is unset or 'latest'. Pin a specific version (e.g. 1.3.14-stable) and set ACLI_SHA256 to its digest."
            exit 1
          fi
          mkdir -p ~/.acli
          curl -sSL "https://acli.atlassian.com/linux/${ACLI_VERSION}/acli_${ACLI_VERSION}_linux_amd64.tar.gz" -o ~/.acli/acli.tar.gz
          if [ -n "$ACLI_SHA256" ]; then
            echo "${ACLI_SHA256}  $HOME/.acli/acli.tar.gz" | sha256sum -c --strict
          else
            echo "::warning::ACLI_SHA256 unset — proceeding without checksum verification. Set it to: $(sha256sum ~/.acli/acli.tar.gz | awk '{print $1}')"
          fi
          tar xzf ~/.acli/acli.tar.gz -C ~/.acli/ --strip-components=1
          chmod +x ~/.acli/acli
          rm -f ~/.acli/acli.tar.gz
          # Validate the extracted binary: must exist, be non-empty, executable,
          # and run --version cleanly. A corrupted tar.gz can pass the earlier
          # file-existence check but produce a zero-byte or truncated binary;
          # catch that here rather than letting the auth step's 'command not
          # found' message hide the root cause.
          if [ ! -s "$HOME/.acli/acli" ] || [ ! -x "$HOME/.acli/acli" ]; then
            echo "::error::Extracted ACLI binary missing, empty, or not executable"
            ls -la ~/.acli/ || true
            exit 1
          fi
          if ! "$HOME/.acli/acli" --version >/dev/null 2>&1; then
            echo "::error::Extracted ACLI binary failed --version smoke check"
            exit 1
          fi

      - name: Add ACLI to PATH and authenticate
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ ! -f "$HOME/.acli/acli" ]; then
            echo "::error::$HOME/.acli/acli not found — download/extraction failed"
            exit 1
          fi
          sudo ln -sf "$HOME/.acli/acli" /usr/local/bin/acli
          echo "$JIRA_API_TOKEN" | acli jira auth login \
            --site "$JIRA_URL" \
            --email "$JIRA_USER" \
            --token

      - name: Configure git identity for bridge bot
        # Set at --global scope so every worktree (the main checkout, the
        # pre-mounted .tickets-tracker, AND any temp worktrees the reconciler
        # creates internally via _advisory_lock) inherits the identity. The
        # later "Commit reconciler events back to tickets branch" step still
        # re-asserts these values with --local inside .tickets-tracker, which
        # is harmless once the --global config exists. Without this step,
        # `git commit` inside the reconciler's temp worktree fails exit 128
        # with "fatal: empty ident name" because CI runners have no global
        # git identity by default (bug bbf0-3380-74ab-4200).
        #
        # Defaults match the existing "Commit reconciler events back" step
        # (dso-bridge[bot] / dso-bridge@users.noreply.github.com) so a single
        # BRIDGE_BOT_NAME / BRIDGE_BOT_EMAIL repo variable controls both
        # commit surfaces consistently.
        env:
          BRIDGE_BOT_NAME: ${{ vars.BRIDGE_BOT_NAME || 'dso-bridge[bot]' }}
          BRIDGE_BOT_EMAIL: ${{ vars.BRIDGE_BOT_EMAIL || 'dso-bridge@users.noreply.github.com' }}
        run: |
          set -euo pipefail
          git config --global user.name "${BRIDGE_BOT_NAME}"
          git config --global user.email "${BRIDGE_BOT_EMAIL}"

      - name: ACLI discovery probe (mode=probe)
        if: github.event.inputs.mode == 'probe'
        # Disable `set -e` (the runner's default `bash -e`) so a single failed
        # ACLI invocation in one of the exploratory probes does not abort the
        # rest. Each probe is independent and we want to see all results.
        shell: 'bash {0}'
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT || 'DIG' }}
        run: |
          set -uo pipefail
          PROJ="${JIRA_PROJECT:-DIG}"
          PASS=0; FAIL=0; SKIP=0
          _pass() { echo "  ✅ PASS: $1"; PASS=$((PASS+1)); }
          _fail() { echo "  ❌ FAIL: $1"; FAIL=$((FAIL+1)); }
          _skip() { echo "  ⏭️  SKIP: $1"; SKIP=$((SKIP+1)); }

          # Helper: read a single field from a Jira issue via ACLI SEARCH
          # CRITICAL: `acli workitem view --json` produces EMPTY stdout.
          # Must use `search --jql "key=KEY" -f "..." --json` instead.
          _get_field() {
            local key="$1" field="$2"
            acli jira workitem search --jql "key = $key" \
              -f "key,summary,description,status,priority,issuetype,assignee,labels" \
              --json 2>/dev/null | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          issues=d if isinstance(d,list) else d.get('issues',[])
          if not issues: print('<no-issue>'); sys.exit()
          f=issues[0].get('fields',{}) or {}
          val=f.get('$field') or issues[0].get('$field')
          if isinstance(val,dict): print(val.get('name') or val.get('displayName') or json.dumps(val))
          elif isinstance(val,list): print(json.dumps(val))
          elif val is None: print('<null>')
          else: print(val)
          " 2>/dev/null
          }

          # Helper: get full issue JSON via search (view --json is broken)
          _get_issue() {
            acli jira workitem search --jql "key = $1" \
              -f "key,summary,description,status,priority,issuetype,assignee,labels" \
              --json 2>/dev/null | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          issues=d if isinstance(d,list) else d.get('issues',[])
          if issues: json.dump(issues[0],sys.stdout)
          else: json.dump({},sys.stdout)
          " 2>/dev/null
          }

          # Helper: extract text from ADF (for description/comment body reads)
          _adf_to_text() {
            python3 -c "
          import json,sys
          def walk(node):
            if isinstance(node,dict):
              if node.get('type')=='text': return node.get('text','')
              if node.get('type')=='hardBreak': return '\n'
              return ''.join(walk(c) for c in node.get('content',[]))
            if isinstance(node,list): return ''.join(walk(c) for c in node)
            return ''
          try:
            d=json.load(sys.stdin)
            # Handle both: raw ADF doc, or full issue with description field
            if isinstance(d,dict) and d.get('type')=='doc':
              print(walk(d))
            elif isinstance(d,dict):
              desc=d.get('description') or d.get('fields',{}).get('description',{})
              print(walk(desc) if isinstance(desc,dict) else str(desc or ''))
            else: print('')
          except: print('')
          "
          }

          # =====================================================================
          echo "=== PHASE 1: CREATE a throwaway test issue ==="
          # =====================================================================
          CREATE_OUT=$(acli jira workitem create \
            --project "$PROJ" \
            --type "Task" \
            --summary "DSO-PROBE-$(date +%s): field sync validation" \
            --description "Initial description for probe test" \
            --json 2>&1)
          TEST_KEY=$(echo "$CREATE_OUT" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            print(d.get('key',''))
          except: print('')
          " 2>/dev/null)
          if [ -z "$TEST_KEY" ]; then
            echo "FATAL: could not create test issue"
            echo "ACLI output: $CREATE_OUT"
            exit 1
          fi
          echo "Created test issue: $TEST_KEY"
          echo

          # Verify initial state
          echo "--- Initial state of $TEST_KEY ---"
          INIT_SUMMARY=$(_get_field "$TEST_KEY" "summary")
          INIT_DESC=$(_get_field "$TEST_KEY" "description")
          # RAW DUMP: diagnose view --json output format
          echo "  === RAW view --json output (first 1000 chars) ==="
          RAW_VIEW=$(acli jira workitem view --key "$TEST_KEY" --json 2>/dev/null)
          echo "$RAW_VIEW" | head -c 1000
          echo
          echo "  === RAW view top-level keys ==="
          echo "$RAW_VIEW" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            print(f'type={type(d).__name__}')
            if isinstance(d,dict): print(f'keys={sorted(d.keys())[:20]}')
            elif isinstance(d,list): print(f'len={len(d)}, first_keys={sorted(d[0].keys())[:20] if d else []}')
          except Exception as e: print(f'PARSE_ERROR: {e}')
          " 2>/dev/null
          echo "  ==="

          INIT_STATUS=$(_get_field "$TEST_KEY" "status")
          INIT_PRIORITY=$(_get_field "$TEST_KEY" "priority")
          INIT_TYPE=$(_get_field "$TEST_KEY" "issuetype")
          INIT_ASSIGNEE=$(_get_field "$TEST_KEY" "assignee")
          echo "  summary: $INIT_SUMMARY"
          echo "  description: $INIT_DESC"
          echo "  status: $INIT_STATUS"
          echo "  priority: $INIT_PRIORITY"
          echo "  issuetype: $INIT_TYPE"
          echo "  assignee: $INIT_ASSIGNEE"
          echo

          # Create a SECOND throwaway for link tests
          CREATE2_OUT=$(acli jira workitem create \
            --project "$PROJ" \
            --type "Task" \
            --summary "DSO-PROBE-LINK-TARGET-$(date +%s)" \
            --json 2>&1)
          LINK_KEY=$(echo "$CREATE2_OUT" | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin); print(d.get('key',''))
          except: print('')
          " 2>/dev/null)
          echo "Created link target: $LINK_KEY"
          echo

          # =====================================================================
          echo "=== PHASE 2: DESCRIPTION — read, edit, verify ==="
          # =====================================================================

          # Wait for Jira to index the new issue (search can lag behind create)
          echo "  (waiting 15s for Jira index to catch up...)"
          sleep 15

          # Test 2a: Read description via search -f
          echo "Test 2a: ACLI search -f includes description"
          SEARCH_DESC=$(acli jira workitem search \
            --jql "key = $TEST_KEY" \
            -f "key,summary,description" \
            --json 2>&1 | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            issues=d if isinstance(d,list) else d.get('issues',[])
            if issues:
              f=issues[0].get('fields',{}) or {}
              desc=f.get('description') or issues[0].get('description')
              if desc is None: print('NOT_IN_PROJECTION')
              elif isinstance(desc,dict): print('ADF:' + desc.get('type','?'))
              else: print(str(desc)[:100])
            else: print('NO_ISSUES')
          except Exception as e: print(f'ERROR:{e}')
          " 2>/dev/null)
          echo "  search -f description result: $SEARCH_DESC"
          if [[ "$SEARCH_DESC" == ADF:doc ]]; then _pass "search -f description returns ADF"
          elif [[ "$SEARCH_DESC" == NOT_IN_PROJECTION ]]; then _fail "description not in search projection"
          elif [[ "$SEARCH_DESC" == ERROR:* ]]; then _fail "search -f description: $SEARCH_DESC"
          elif [[ "$SEARCH_DESC" == NO_ISSUES ]]; then _fail "search returned NO_ISSUES (Jira index delay?)"
          else _pass "search -f description returns: $SEARCH_DESC"; fi

          # Test 2b: Read description via ACLI view (flat dict, not nested fields)
          echo "Test 2b: ACLI view includes description"
          VIEW_DESC=$(_get_issue "$TEST_KEY" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          # ACLI view returns flat dict — try top-level first, then nested
          desc=d.get('description')
          if desc is None:
            f=d.get('fields',{}) or {}
            desc=f.get('description')
          if desc is None: print('NULL')
          elif isinstance(desc,dict): print('ADF:' + desc.get('type','?'))
          else: print('TEXT:' + str(desc)[:100])
          " 2>/dev/null)
          echo "  view description result: $VIEW_DESC"
          if [[ "$VIEW_DESC" == ADF:doc ]]; then _pass "view returns description as ADF"
          elif [[ "$VIEW_DESC" == TEXT:* ]]; then _pass "view returns description as text: ${VIEW_DESC:5:60}"
          elif [[ "$VIEW_DESC" == NULL ]]; then _fail "view description: NULL (field not returned)"
          else _fail "view description: $VIEW_DESC"; fi

          # Test 2c: Edit description via ACLI
          echo "Test 2c: Edit description via ACLI"
          acli jira workitem edit --key "$TEST_KEY" --description "Updated description via ACLI probe" --yes 2>/dev/null
          EDIT_RC=$?
          AFTER_DESC=$(_get_issue "$TEST_KEY" | _adf_to_text)
          if [ -z "$AFTER_DESC" ]; then
            # Fallback: try reading description as flat string
            AFTER_DESC=$(_get_field "$TEST_KEY" "description")
          fi
          echo "  edit rc=$EDIT_RC, description after: '$AFTER_DESC'"
          if [ "$EDIT_RC" -eq 0 ] && [[ "$AFTER_DESC" == *"Updated description"* ]]; then
            _pass "edit description via ACLI"
          else _fail "edit description: rc=$EDIT_RC, got '$AFTER_DESC'"; fi

          # =====================================================================
          echo; echo "=== PHASE 3: PRIORITY — read, edit ==="
          # =====================================================================

          echo "Test 3a: Read priority"
          PRI_BEFORE=$(_get_field "$TEST_KEY" "priority")
          echo "  priority before: $PRI_BEFORE"
          [[ -n "$PRI_BEFORE" && "$PRI_BEFORE" != "<null>" ]] && _pass "read priority" || _fail "read priority: $PRI_BEFORE"

          echo "Test 3b: Edit priority via ACLI (expect failure)"
          acli jira workitem edit --key "$TEST_KEY" --priority "High" --yes 2>/dev/null
          ACLI_PRI_RC=$?
          PRI_AFTER_ACLI=$(_get_field "$TEST_KEY" "priority")
          echo "  ACLI edit rc=$ACLI_PRI_RC, priority after: $PRI_AFTER_ACLI"

          echo "Test 3c: Edit priority via REST API"
          python3 -c "
          import urllib.request, urllib.error, json, base64, os
          url=os.environ['JIRA_URL'].rstrip('/')+'/rest/api/3/issue/$TEST_KEY'
          creds=base64.b64encode(f\"{os.environ['JIRA_USER']}:{os.environ['JIRA_API_TOKEN']}\".encode()).decode()
          data=json.dumps({'fields':{'priority':{'name':'Highest'}}}).encode()
          req=urllib.request.Request(url,data=data,method='PUT',headers={'Authorization':f'Basic {creds}','Content-Type':'application/json','Accept':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=10) as r: print(f'OK:{r.status}')
          except urllib.error.HTTPError as e: print(f'ERROR:{e.code}:{e.read().decode()[:200]}')
          except Exception as e: print(f'EXCEPTION:{e}')
          "
          REST_PRI_RC=$?
          PRI_AFTER_REST=$(_get_field "$TEST_KEY" "priority")
          echo "  REST edit result, priority after: $PRI_AFTER_REST"
          [[ "$PRI_AFTER_REST" == "Highest" ]] && _pass "edit priority via REST" || _fail "edit priority via REST: got $PRI_AFTER_REST"

          # =====================================================================
          echo; echo "=== PHASE 4: ISSUETYPE — read, edit ==="
          # =====================================================================

          echo "Test 4a: Read issuetype"
          TYPE_BEFORE=$(_get_field "$TEST_KEY" "issuetype")
          echo "  issuetype before: $TYPE_BEFORE"

          echo "Test 4b: Edit issuetype via REST API (Task -> Story)"
          python3 -c "
          import urllib.request, urllib.error, json, base64, os
          url=os.environ['JIRA_URL'].rstrip('/')+'/rest/api/3/issue/$TEST_KEY'
          creds=base64.b64encode(f\"{os.environ['JIRA_USER']}:{os.environ['JIRA_API_TOKEN']}\".encode()).decode()
          data=json.dumps({'fields':{'issuetype':{'name':'Story'}}}).encode()
          req=urllib.request.Request(url,data=data,method='PUT',headers={'Authorization':f'Basic {creds}','Content-Type':'application/json','Accept':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=10) as r: print(f'OK:{r.status}')
          except urllib.error.HTTPError as e: print(f'ERROR:{e.code}:{e.read().decode()[:200]}')
          except Exception as e: print(f'EXCEPTION:{e}')
          "
          TYPE_AFTER=$(_get_field "$TEST_KEY" "issuetype")
          echo "  issuetype after: $TYPE_AFTER"
          [[ "$TYPE_AFTER" == "Story" ]] && _pass "edit issuetype via REST" || _fail "edit issuetype via REST: got $TYPE_AFTER"

          # =====================================================================
          echo; echo "=== PHASE 5: STATUS — read, transition ==="
          # =====================================================================

          echo "Test 5a: Read status"
          STATUS_BEFORE=$(_get_field "$TEST_KEY" "status")
          echo "  status before: $STATUS_BEFORE"

          echo "Test 5b: Transition status (To Do -> Done)"
          acli jira workitem transition --key "$TEST_KEY" --status "Done" 2>/dev/null
          TRANS_RC=$?
          STATUS_AFTER=$(_get_field "$TEST_KEY" "status")
          echo "  transition rc=$TRANS_RC, status after: $STATUS_AFTER"
          [[ "$STATUS_AFTER" == "Done" ]] && _pass "transition status" || _fail "transition status: got $STATUS_AFTER"

          echo "Test 5c: Transition back (Done -> To Do)"
          acli jira workitem transition --key "$TEST_KEY" --status "To Do" 2>/dev/null
          STATUS_BACK=$(_get_field "$TEST_KEY" "status")
          echo "  status after back: $STATUS_BACK"
          [[ "$STATUS_BACK" == "To Do" ]] && _pass "transition back" || _fail "transition back: got $STATUS_BACK"

          # =====================================================================
          echo; echo "=== PHASE 6: ASSIGNEE — read, set, clear ==="
          # =====================================================================

          echo "Test 6a: Set assignee"
          acli jira workitem edit --key "$TEST_KEY" --assignee "$JIRA_USER" --yes 2>/dev/null
          ASSIGNEE_AFTER=$(_get_field "$TEST_KEY" "assignee")
          echo "  assignee after set: $ASSIGNEE_AFTER"
          [[ -n "$ASSIGNEE_AFTER" && "$ASSIGNEE_AFTER" != "<null>" ]] && _pass "set assignee" || _fail "set assignee: $ASSIGNEE_AFTER"

          echo "Test 6b: Clear assignee"
          acli jira workitem edit --key "$TEST_KEY" --assignee "" --yes 2>/dev/null
          ASSIGNEE_CLEARED=$(_get_field "$TEST_KEY" "assignee")
          echo "  assignee after clear: $ASSIGNEE_CLEARED"
          [[ "$ASSIGNEE_CLEARED" == "<null>" ]] && _pass "clear assignee" || _fail "clear assignee: $ASSIGNEE_CLEARED"

          # =====================================================================
          echo; echo "=== PHASE 7: COMMENTS — add, list, edit, delete ==="
          # =====================================================================

          echo "Test 7a: Add comment via ACLI"
          ADD_CMT=$(acli jira workitem comment create --key "$TEST_KEY" --body "Probe comment 1" --json 2>&1)
          echo "  raw comment create response: $(echo "$ADD_CMT" | head -c 300)"
          # ACLI comment create returns {"results":[{"status":"SUCCESS","id":"DIG-KEY"}]}
          # NOT {"id":"<comment-id>"}. Get comment ID from list instead.
          ADD_STATUS=$(echo "$ADD_CMT" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            if 'results' in d and d['results']:
              print(d['results'][0].get('status',''))
            elif 'id' in d: print('SUCCESS')
            else: print('UNKNOWN')
          except: print('PARSE_ERROR')
          " 2>/dev/null)
          echo "  add status: $ADD_STATUS"
          [[ "$ADD_STATUS" == "SUCCESS" ]] && _pass "add comment" || _fail "add comment: status=$ADD_STATUS"
          # Get actual comment ID from list
          CMT_ID=$(acli jira workitem comment list --key "$TEST_KEY" --json 2>/dev/null | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            cmts=d if isinstance(d,list) else d.get('comments',[])
            if cmts: print(cmts[-1].get('id',''))
          except: pass
          " 2>/dev/null)
          echo "  comment ID from list: $CMT_ID"

          echo "Test 7b: List comments"
          CMT_COUNT=$(acli jira workitem comment list --key "$TEST_KEY" --json 2>/dev/null | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            cmts=d if isinstance(d,list) else d.get('comments',[])
            print(len(cmts))
          except: print(0)
          " 2>/dev/null)
          echo "  comment count: $CMT_COUNT"
          [[ "$CMT_COUNT" -ge 1 ]] && _pass "list comments ($CMT_COUNT)" || _fail "list comments: $CMT_COUNT"

          echo "Test 7c: Edit comment via ACLI"
          if [ -n "$CMT_ID" ]; then
            acli jira workitem comment update --key "$TEST_KEY" --id "$CMT_ID" --body "Probe comment 1 EDITED" 2>/dev/null
            EDIT_CMT_RC=$?
            # Verify edit
            EDITED_BODY=$(acli jira workitem comment list --key "$TEST_KEY" --json 2>/dev/null | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            cmts=d if isinstance(d,list) else d.get('comments',[])
            for c in cmts:
              if str(c.get('id',''))=='$CMT_ID':
                body=c.get('body','')
                if isinstance(body,dict):
                  def walk(n):
                    if isinstance(n,dict):
                      if n.get('type')=='text': return n.get('text','')
                      return ''.join(walk(x) for x in n.get('content',[]))
                    if isinstance(n,list): return ''.join(walk(x) for x in n)
                    return ''
                  print(walk(body))
                else: print(str(body)[:100])
                break
          except Exception as e: print(f'ERROR:{e}')
          " 2>/dev/null)
            echo "  edit rc=$EDIT_CMT_RC, body after: '$EDITED_BODY'"
            if [[ "$EDITED_BODY" == *"EDITED"* ]]; then _pass "edit comment via ACLI"
            else _fail "edit comment: rc=$EDIT_CMT_RC, got '$EDITED_BODY'"; fi
          else _skip "edit comment (no comment ID)"; fi

          echo "Test 7d: Delete comment via REST"
          if [ -n "$CMT_ID" ]; then
            python3 -c "
          import urllib.request, urllib.error, base64, os
          url=os.environ['JIRA_URL'].rstrip('/')+'/rest/api/3/issue/$TEST_KEY/comment/$CMT_ID'
          creds=base64.b64encode(f\"{os.environ['JIRA_USER']}:{os.environ['JIRA_API_TOKEN']}\".encode()).decode()
          req=urllib.request.Request(url,method='DELETE',headers={'Authorization':f'Basic {creds}','Accept':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=10) as r: print(f'OK:{r.status}')
          except urllib.error.HTTPError as e: print(f'ERROR:{e.code}:{e.read().decode()[:100]}')
          "
            DEL_CMT_COUNT=$(acli jira workitem comment list --key "$TEST_KEY" --json 2>/dev/null | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin); cmts=d if isinstance(d,list) else d.get('comments',[]); print(len(cmts))
          except: print('?')
          " 2>/dev/null)
            echo "  comments after delete: $DEL_CMT_COUNT"
            [[ "$DEL_CMT_COUNT" == "0" ]] && _pass "delete comment via REST" || _fail "delete comment: $DEL_CMT_COUNT remain"
          else _skip "delete comment (no comment ID)"; fi

          # =====================================================================
          echo; echo "=== PHASE 8: LABELS — add, read, remove ==="
          # =====================================================================

          echo "Test 8a: Add label"
          LABEL_TMP=$(mktemp /tmp/label.XXXXXX.json)
