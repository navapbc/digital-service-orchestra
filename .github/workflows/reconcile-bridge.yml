            print(len(relates))
          except: print(0)
          " 2>/dev/null)
            echo "  Relates link rc=$RELATES_RC, relates count=$RELATES_COUNT"
            [[ "$RELATES_COUNT" -ge 1 ]] && _pass "create Relates link" || _fail "Relates link: count=$RELATES_COUNT"

            # Test 9e: List available link types
            echo "Test 9e: List available link types"
            LINK_TYPES=$(acli jira workitem link type list --json 2>/dev/null | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            types=d if isinstance(d,list) else d.get('issueLinkTypes',[])
            names=[t.get('name','?') for t in types if isinstance(t,dict)]
            print(', '.join(names))
          except: print('ERROR')
          " 2>/dev/null)
            echo "  available link types: $LINK_TYPES"
            [[ -n "$LINK_TYPES" && "$LINK_TYPES" != "ERROR" ]] && _pass "list link types: $LINK_TYPES" || _fail "list link types"

            # Cleanup: delete the Relates link
            RELATES_LINK_ID=$(echo "$RELATES_DATA" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            links=d if isinstance(d,list) else d.get('issueLinks') or d.get('issuelinks') or d.get('links',[])
            for l in links:
              if isinstance(l,dict) and l.get('type',{}).get('name','')=='Relates':
                print(l.get('id','')); break
          except: pass
          " 2>/dev/null)
            if [ -n "$RELATES_LINK_ID" ]; then
              acli jira workitem link delete --id "$RELATES_LINK_ID" 2>/dev/null
            fi
          else _skip "link tests (no LINK_KEY)"; fi

          # =====================================================================
          echo; echo "=== PHASE 10: SEARCH PROJECTION — bulk field inclusion ==="
          # =====================================================================

          echo "Test 10a: Search with ALL sync fields in -f"
          PROJ_TEST=$(acli jira workitem search \
            --jql "key = $TEST_KEY" \
            -f "key,summary,description,status,priority,issuetype,assignee,labels" \
            --json 2>&1 | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            issues=d if isinstance(d,list) else d.get('issues',[])
            if issues:
              f=issues[0].get('fields',{}) or {}
              present=[k for k in ['summary','description','status','priority','issuetype','assignee','labels'] if k in f]
              missing=[k for k in ['summary','description','status','priority','issuetype','assignee','labels'] if k not in f]
              print(f'present={len(present)}:{present} missing={len(missing)}:{missing}')
            else: print('NO_ISSUES')
          except Exception as e: print(f'ERROR:{e}')
          " 2>/dev/null)
          echo "  projection result: $PROJ_TEST"
          if [[ "$PROJ_TEST" == present=7:* && "$PROJ_TEST" != *"missing="*[a-z]* ]]; then
            _pass "all 7 sync fields in search projection"
          elif [[ "$PROJ_TEST" == ERROR:* ]]; then
            _fail "search projection: $PROJ_TEST"
          else
            echo "  (partial — checking which fields work)"
            _fail "search projection incomplete: $PROJ_TEST"
          fi

          # =====================================================================
          echo; echo "=== CLEANUP: Delete throwaway issues ==="
          # =====================================================================

          acli jira workitem delete --key "$TEST_KEY" --yes 2>/dev/null
          DEL1_RC=$?
          echo "  deleted $TEST_KEY: rc=$DEL1_RC"
          if [ -n "$LINK_KEY" ]; then
            acli jira workitem delete --key "$LINK_KEY" --yes 2>/dev/null
            echo "  deleted $LINK_KEY: rc=$?"
          fi

          # =====================================================================
          echo; echo "=========================================="
          echo "PROBE SUMMARY: $PASS passed, $FAIL failed, $SKIP skipped"
          echo "=========================================="
          [ "$FAIL" -gt 0 ] && echo "::warning::$FAIL probe(s) failed — review details above"
          echo "=== Probe complete — exiting (not running reconciler in probe mode) ==="
          exit 0
          # Skip all legacy probes below
          exit 0
          echo "=== Probe 0: ALL assignees in project ${PROJ} ==="
          acli jira workitem search --jql "project = ${PROJ}" --paginate --json \
            | python3 -c "
          import json, sys, collections
          data = json.load(sys.stdin)
          issues = data if isinstance(data, list) else data.get('issues', [])
          print(f'total issues fetched: {len(issues)}')
          assignees = collections.Counter()
          assigned_keys = collections.defaultdict(list)
          for i in issues:
              fields = i.get('fields', {}) if isinstance(i.get('fields'), dict) else {}
              assignee_obj = fields.get('assignee') or i.get('assignee')
              key = i.get('key', '?')
              if assignee_obj is None:
                  assignees['<unassigned>'] += 1
              elif isinstance(assignee_obj, dict):
                  name = assignee_obj.get('displayName') or assignee_obj.get('name') or assignee_obj.get('emailAddress') or '<unknown-dict>'
                  acct_id = assignee_obj.get('accountId', '?')
                  label = f'{name} (id:{acct_id})'
                  assignees[label] += 1
                  assigned_keys[label].append(key)
              elif isinstance(assignee_obj, str):
                  assignees[assignee_obj] += 1
                  assigned_keys[assignee_obj].append(key)
              else:
                  assignees['<other>'] += 1
          print('assignee counts:')
          for a, n in assignees.most_common():
              sample = ', '.join(assigned_keys[a][:5])
              extra = f' ... +{len(assigned_keys[a])-5} more' if len(assigned_keys[a]) > 5 else ''
              print(f'  {n:6d}  {a}  [sample: {sample}{extra}]')
          "
          echo
          echo "=== Probe 0b: FULL detail on non-standard assignees ==="
          acli jira workitem search --jql "project = ${PROJ} AND assignee IS NOT EMPTY AND assignee NOT IN ('712020:6471376f-4e5e-4ed2-8c05-330827bc387e')" --paginate --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          issues = data if isinstance(data, list) else data.get('issues', [])
          print(f'non-standard assignee issues: {len(issues)}')
          for i in issues:
              key = i.get('key', '?')
              fields = i.get('fields', {}) if isinstance(i.get('fields'), dict) else {}
              summary = fields.get('summary') or '?'
              status_obj = fields.get('status') or {}
              status = status_obj.get('name') if isinstance(status_obj, dict) else status_obj
              issuetype_obj = fields.get('issuetype') or {}
              issuetype = issuetype_obj.get('name') if isinstance(issuetype_obj, dict) else issuetype_obj
              priority_obj = fields.get('priority') or {}
              priority = priority_obj.get('name') if isinstance(priority_obj, dict) else priority_obj
              assignee_obj = fields.get('assignee') or {}
              a_name = assignee_obj.get('displayName', '?') if isinstance(assignee_obj, dict) else assignee_obj
              a_id = assignee_obj.get('accountId', '?') if isinstance(assignee_obj, dict) else '?'
              a_email = assignee_obj.get('emailAddress', '?') if isinstance(assignee_obj, dict) else '?'
              print(f'  {key:12s} | type={issuetype} | status={status} | pri={priority} | assignee={a_name} (id:{a_id}, email:{a_email})')
              print(f'               | summary={summary[:100]}')
          "
          echo
          echo "=== Probe 0c: Unassign Jessica Westbrook issues ==="
          JW_KEYS=$(acli jira workitem search --jql "project = ${PROJ} AND assignee = '712020:6d8ef732-ff63-45db-a1e2-05635e957b77'" --paginate --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          issues = data if isinstance(data, list) else data.get('issues', [])
          for i in issues:
              k = i.get('key', '')
              if k: print(k)
          ")
          JW_COUNT=$(echo "$JW_KEYS" | grep -c "DIG-" || true)
          echo "Issues to unassign: $JW_COUNT"
