# Digital Service Orchestra — Jira↔DSO Reconciler
# Runs the drift-healing reconciler on a ~20-minute cadence to keep the
# Jira mirror and the local ticket tracker in sync.
#
# Single-flight concurrency (cancel-in-progress: false) ensures a running
# reconciler completes before the next scheduled invocation starts.

name: Reconcile Bridge

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: reconcile-bridge
  cancel-in-progress: false

jobs:
  reconcile:
    name: Run DSO reconciler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: plugins/dso/scripts/requirements.lock

      - name: Install Python dependencies
        run: pip install -r plugins/dso/scripts/requirements.lock

      - name: Run reconciler
        run: python -m dso_reconciler
        working-directory: plugins/dso/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          BRIDGE_ENV_ID: ${{ secrets.BRIDGE_ENV_ID }}
