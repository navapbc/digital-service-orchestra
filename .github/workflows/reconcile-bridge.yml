            LINK_RC=$?
            echo "  link create rc=$LINK_RC"

            echo "Test 9b: Read links"
            LINK_DATA=$(acli jira workitem link list --key "$TEST_KEY" --json 2>/dev/null)
            echo "  === RAW link list output (first 500 chars) ==="
