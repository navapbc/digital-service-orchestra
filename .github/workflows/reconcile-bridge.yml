# Digital Service Orchestra — Jira↔DSO Reconciler
#
# MERGE LAST — depends on dso_reconciler/__main__.py from PR 3 and bands from
# PR 4. This workflow MUST be merged after PRs 3 and 4 are on main; otherwise
# the reconciler invocation (`python -m dso_reconciler`) will fail because
# the package entry point will not exist on main.
#
# Runs the drift-healing reconciler on a ~20-minute cadence to keep the
# Jira mirror and the local ticket tracker in sync.
#
# Single-flight concurrency (cancel-in-progress: false) ensures a running
# reconciler completes before the next scheduled invocation starts.

name: Reconcile Bridge

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Reconciler rollout-safety mode (dry-run | bootstrap-strict | bootstrap-throttle | live | probe)'
        required: false
        default: 'live'
        type: choice
        options:
          - dry-run
          - bootstrap-strict
          - bootstrap-throttle
          - live
          - probe

concurrency:
  group: reconcile-bridge
  cancel-in-progress: false

jobs:
  reconcile:
    name: Run DSO reconciler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Validate BRIDGE_ENV_ID
        env:
          BRIDGE_ENV_ID: ${{ vars.BRIDGE_ENV_ID }}
        run: |
          if [ -z "$BRIDGE_ENV_ID" ]; then
            echo "::error::BRIDGE_ENV_ID is unset or empty. Set as a repo variable:"
            echo "  gh variable set BRIDGE_ENV_ID --body \"\$(uuidgen || python3 -c 'import uuid; print(uuid.uuid4())')\""
            exit 1
          fi

      - name: Validate reconciler entry point is present
        run: |
          # Pre-flight guard: this PR (cutover) MUST merge after PR 3 (reconciler
          # __main__.py) and PR 4 (bands). If either is missing, fail fast with
          # a clear message rather than letting `python -m dso_reconciler` emit
          # an opaque ModuleNotFoundError.
          if [ ! -f plugins/dso/scripts/dso_reconciler/__main__.py ]; then
            echo "::error::dso_reconciler/__main__.py is missing — PR 3 has not been merged to main yet. This workflow MUST merge after PR 3."
            exit 1
          fi

      - name: Mount tickets branch as worktree
        run: |
          git fetch origin tickets --depth=1
          # Remove the placeholder .tickets-tracker/ from main (if it exists)  # tickets-boundary-ok
          rm -rf .tickets-tracker  # tickets-boundary-ok
          git worktree add .tickets-tracker tickets  # tickets-boundary-ok

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: plugins/dso/scripts/requirements.lock

      - name: Install Python dependencies
        run: pip install -r plugins/dso/scripts/requirements.lock

      - name: Cache ACLI binary
        id: cache-acli
        uses: actions/cache@v4
        with:
          path: ~/.acli
          key: acli-${{ runner.os }}-${{ vars.ACLI_VERSION || 'latest' }}

      - name: Download + verify + install ACLI
        if: steps.cache-acli.outputs.cache-hit != 'true'
        env:
          ACLI_VERSION: ${{ vars.ACLI_VERSION }}
          ACLI_SHA256: ${{ vars.ACLI_SHA256 }}
        run: |
          if [ -z "$ACLI_VERSION" ] || [ "$ACLI_VERSION" = "latest" ]; then
            echo "::error::ACLI_VERSION repo variable is unset or 'latest'. Pin a specific version (e.g. 1.3.14-stable) and set ACLI_SHA256 to its digest."
            exit 1
          fi
          mkdir -p ~/.acli
          curl -sSL "https://acli.atlassian.com/linux/${ACLI_VERSION}/acli_${ACLI_VERSION}_linux_amd64.tar.gz" -o ~/.acli/acli.tar.gz
          if [ -n "$ACLI_SHA256" ]; then
            echo "${ACLI_SHA256}  $HOME/.acli/acli.tar.gz" | sha256sum -c --strict
          else
            echo "::warning::ACLI_SHA256 unset — proceeding without checksum verification. Set it to: $(sha256sum ~/.acli/acli.tar.gz | awk '{print $1}')"
          fi
          tar xzf ~/.acli/acli.tar.gz -C ~/.acli/ --strip-components=1
          chmod +x ~/.acli/acli
          rm -f ~/.acli/acli.tar.gz
          # Validate the extracted binary: must exist, be non-empty, executable,
          # and run --version cleanly. A corrupted tar.gz can pass the earlier
          # file-existence check but produce a zero-byte or truncated binary;
          # catch that here rather than letting the auth step's 'command not
          # found' message hide the root cause.
          if [ ! -s "$HOME/.acli/acli" ] || [ ! -x "$HOME/.acli/acli" ]; then
            echo "::error::Extracted ACLI binary missing, empty, or not executable"
            ls -la ~/.acli/ || true
            exit 1
          fi
          if ! "$HOME/.acli/acli" --version >/dev/null 2>&1; then
            echo "::error::Extracted ACLI binary failed --version smoke check"
            exit 1
          fi

      - name: Add ACLI to PATH and authenticate
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ ! -f "$HOME/.acli/acli" ]; then
            echo "::error::$HOME/.acli/acli not found — download/extraction failed"
            exit 1
          fi
          sudo ln -sf "$HOME/.acli/acli" /usr/local/bin/acli
          echo "$JIRA_API_TOKEN" | acli jira auth login \
            --site "$JIRA_URL" \
            --email "$JIRA_USER" \
            --token

      - name: Configure git identity for bridge bot
        # Set at --global scope so every worktree (the main checkout, the
        # pre-mounted .tickets-tracker, AND any temp worktrees the reconciler
        # creates internally via _advisory_lock) inherits the identity. The
        # later "Commit reconciler events back to tickets branch" step still
        # re-asserts these values with --local inside .tickets-tracker, which
        # is harmless once the --global config exists. Without this step,
        # `git commit` inside the reconciler's temp worktree fails exit 128
        # with "fatal: empty ident name" because CI runners have no global
        # git identity by default (bug bbf0-3380-74ab-4200).
        #
        # Defaults match the existing "Commit reconciler events back" step
        # (dso-bridge[bot] / dso-bridge@users.noreply.github.com) so a single
        # BRIDGE_BOT_NAME / BRIDGE_BOT_EMAIL repo variable controls both
        # commit surfaces consistently.
        env:
          BRIDGE_BOT_NAME: ${{ vars.BRIDGE_BOT_NAME || 'dso-bridge[bot]' }}
          BRIDGE_BOT_EMAIL: ${{ vars.BRIDGE_BOT_EMAIL || 'dso-bridge@users.noreply.github.com' }}
        run: |
          set -euo pipefail
          git config --global user.name "${BRIDGE_BOT_NAME}"
          git config --global user.email "${BRIDGE_BOT_EMAIL}"

      - name: ACLI discovery probe (mode=probe)
        if: github.event.inputs.mode == 'probe'
        # Disable `set -e` (the runner's default `bash -e`) so a single failed
        # ACLI invocation in one of the exploratory probes does not abort the
        # rest. Each probe is independent and we want to see all results.
        shell: 'bash {0}'
        env:
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT || 'DIG' }}
        run: |
          set -uo pipefail
          PROJ="${JIRA_PROJECT:-DIG}"
          echo "=== Probe 0: ALL assignees in project ${PROJ} ==="
          acli jira workitem search --jql "project = ${PROJ}" --paginate --json \
            | python3 -c "
          import json, sys, collections
          data = json.load(sys.stdin)
          issues = data if isinstance(data, list) else data.get('issues', [])
          print(f'total issues fetched: {len(issues)}')
          assignees = collections.Counter()
          assigned_keys = collections.defaultdict(list)
          for i in issues:
              fields = i.get('fields', {}) if isinstance(i.get('fields'), dict) else {}
              assignee_obj = fields.get('assignee') or i.get('assignee')
              key = i.get('key', '?')
              if assignee_obj is None:
                  assignees['<unassigned>'] += 1
              elif isinstance(assignee_obj, dict):
                  name = assignee_obj.get('displayName') or assignee_obj.get('name') or assignee_obj.get('emailAddress') or '<unknown-dict>'
                  acct_id = assignee_obj.get('accountId', '?')
                  label = f'{name} (id:{acct_id})'
                  assignees[label] += 1
                  assigned_keys[label].append(key)
              elif isinstance(assignee_obj, str):
                  assignees[assignee_obj] += 1
                  assigned_keys[assignee_obj].append(key)
              else:
                  assignees['<other>'] += 1
          print('assignee counts:')
          for a, n in assignees.most_common():
              sample = ', '.join(assigned_keys[a][:5])
              extra = f' ... +{len(assigned_keys[a])-5} more' if len(assigned_keys[a]) > 5 else ''
              print(f'  {n:6d}  {a}  [sample: {sample}{extra}]')
          "
          echo
          echo "=== Probe 1: distinct statuses in project ${PROJ} ==="
          acli jira workitem search --jql "project = ${PROJ}" --paginate --json \
            | python3 -c "
          import json, sys, collections
          data = json.load(sys.stdin)
          issues = data if isinstance(data, list) else data.get('issues', [])
          print(f'total issues fetched: {len(issues)}')
          statuses = collections.Counter()
          for i in issues:
              # Search every plausible status field location until ACLI surface clarified
              status_name = None
              fields = i.get('fields', {}) if isinstance(i.get('fields'), dict) else {}
              status_obj = fields.get('status') or i.get('status')
              if isinstance(status_obj, dict):
                  status_name = status_obj.get('name') or status_obj.get('value')
              elif isinstance(status_obj, str):
                  status_name = status_obj
              statuses[status_name or '<missing>'] += 1
          print('status counts:')
          for s, n in statuses.most_common():
              print(f'  {n:6d}  {s}')
          "
          echo
          echo "=== Probe 2: confirm 'updated' is a valid orderable JQL field ==="
          # ACLI 'updated' should be valid in ORDER BY — verify by running a small query
          acli jira workitem search --jql "project = ${PROJ} ORDER BY updated DESC" --limit 3 --json 2>&1 | head -50 || true
          echo
          echo "=== Probe 3: top 5 issues by 'updated DESC' (verify field name in output) ==="
          acli jira workitem search --jql "project = ${PROJ} ORDER BY updated DESC" --limit 5 --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          issues = data if isinstance(data, list) else data.get('issues', [])
          for i in issues[:5]:
              key = i.get('key')
              fields = i.get('fields', {}) if isinstance(i.get('fields'), dict) else {}
              upd = fields.get('updated') or i.get('updated')
              print(f'  {key:12s}  updated={upd}')
          "
          echo
          echo "=== Probe 4: sample issue shape (first issue from project) ==="
          acli jira workitem search --jql "project = ${PROJ}" --limit 1 --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          issues = data if isinstance(data, list) else data.get('issues', [])
          if issues:
              i = issues[0]
              print('top-level keys:', sorted(i.keys()))
              fields = i.get('fields', {})
              if isinstance(fields, dict):
                  print('fields keys:', sorted(fields.keys())[:30])
                  status = fields.get('status') or i.get('status')
                  print('status object shape:', type(status).__name__, '|', repr(status)[:200])
          "
          echo
          echo "=== Probe 5: ACLI 'workitem search' help — find projection flag ==="
          acli jira workitem search --help 2>&1 | head -80 || true
          echo
          echo "=== Probe 6: confirm --fields adds 'updated' to projection ==="
          echo "--- using -f \"updated,key,status,summary,issuetype,priority,assignee\" ---"
          # Write ACLI stdout to a file so stderr noise doesn't poison the JSON parse
          PROBE6_OUT=$(mktemp /tmp/probe6.XXXXXX.json)
          PROBE6_ERR=$(mktemp /tmp/probe6.XXXXXX.err)
          acli jira workitem search --jql "project = ${PROJ}" --limit 1 \
              -f "updated,key,status,summary,issuetype,priority,assignee" --json \
              >"$PROBE6_OUT" 2>"$PROBE6_ERR"
          echo "--- acli stderr (if any) ---"
          head -5 "$PROBE6_ERR" || true
          echo "--- acli stdout (first 500 chars) ---"
          head -c 500 "$PROBE6_OUT"; echo
          echo "--- parsed shape ---"
          python3 -c "
          import json
          with open('$PROBE6_OUT') as f:
              data = json.load(f)
          issues = data if isinstance(data, list) else data.get('issues', [])
          if issues:
              fields = issues[0].get('fields', {}) or {}
              print(f'  fields keys ({len(fields)}):', sorted(fields.keys()))
              print(f'  updated value: {fields.get(\"updated\")!r}')
              status = fields.get('status') or issues[0].get('status')
              s_name = status.get('name') if isinstance(status, dict) else status
              print(f'  status.name: {s_name!r}')
          else:
              print('  no issues returned')
          " || echo "  (python parse failed — see raw output above)"
          rm -f "$PROBE6_OUT" "$PROBE6_ERR"
          echo
          echo "=== Probe 7: empirical count — Query 1 (status != Done) ==="
          Q1='project = '${PROJ}' AND status != "Done"'
          echo "JQL: ${Q1}"
          acli jira workitem search --jql "${Q1}" --paginate --json \
            | python3 -c "
          import json, sys, collections
          data = json.load(sys.stdin)
          issues = data if isinstance(data, list) else data.get('issues', [])
          statuses = collections.Counter()
          for i in issues:
              fields = i.get('fields', {}) or {}
              s_obj = fields.get('status') or i.get('status')
              s = s_obj.get('name') if isinstance(s_obj, dict) else s_obj
              statuses[s or '<missing>'] += 1
          print(f'Query 1 returned {len(issues)} issues')
          print('  status breakdown:')
          for s, n in statuses.most_common():
              print(f'    {n:6d}  {s}')
          print(f'  under proposed 1200 ceiling: {\"YES\" if len(issues) < 1200 else \"NO — STILL OVER\"}')
          "
          echo
          echo "=== Probe 8: empirical Query 2 (status = Done, ORDER BY updated DESC, limit 1000) ==="
          Q2='project = '${PROJ}' AND status = "Done" ORDER BY updated DESC'
          echo "JQL: ${Q2}"
          acli jira workitem search --jql "${Q2}" --limit 1000 --json \
            | python3 -c "
          import json, sys, collections
          data = json.load(sys.stdin)
          issues = data if isinstance(data, list) else data.get('issues', [])
          statuses = collections.Counter()
          for i in issues:
              fields = i.get('fields', {}) or {}
              s_obj = fields.get('status') or i.get('status')
              s = s_obj.get('name') if isinstance(s_obj, dict) else s_obj
              statuses[s or '<missing>'] += 1
          print(f'Query 2 returned {len(issues)} issues (cap=1000)')
          print('  status breakdown:')
          for s, n in statuses.most_common():
              print(f'    {n:6d}  {s}')
          # Confirm ORDER BY updated DESC took effect — first/last keys should differ
          if issues:
              print(f'  first key: {issues[0].get(\"key\")}, last key: {issues[-1].get(\"key\")}')
          "
          echo
          echo "=== Probe 9: empirical total under split plan (Q1 + Q2 cap-1000) ==="
          Q1_COUNT=$(acli jira workitem search --jql "${Q1}" --paginate --json | python3 -c "import json,sys; d=json.load(sys.stdin); issues=d if isinstance(d,list) else d.get('issues',[]); print(len(issues))")
          Q2_COUNT=$(acli jira workitem search --jql "${Q2}" --limit 1000 --json | python3 -c "import json,sys; d=json.load(sys.stdin); issues=d if isinstance(d,list) else d.get('issues',[]); print(len(issues))")
          echo "  Query 1 (active): ${Q1_COUNT}"
          echo "  Query 2 (Done, cap 1000): ${Q2_COUNT}"
          echo "  Plan ceiling per query: 1200"
          echo "  Q1 under 1200: $([ "${Q1_COUNT}" -lt 1200 ] && echo YES || echo NO)"
          echo "  Q2 under 1200: $([ "${Q2_COUNT}" -lt 1200 ] && echo YES || echo NO)"
          echo
          echo "=== Probe complete — exiting (not running reconciler in probe mode) ==="
          exit 0

      - name: Run reconciler
        if: github.event.inputs.mode != 'probe'
        # When triggered via workflow_dispatch, honour the operator-selected
        # rollout-safety mode. On schedule and other event types,
        # github.event.inputs.mode is empty and the reconciler falls back to
        # its own default (Mode.LIVE) — matching pre-input behaviour.
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            python -m dso_reconciler --mode "${{ github.event.inputs.mode }}"
          else
            python -m dso_reconciler
          fi
        working-directory: plugins/dso/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_URL: ${{ vars.JIRA_URL }}
          JIRA_USER: ${{ vars.JIRA_USER }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: ${{ vars.JIRA_PROJECT || 'DIG' }}
          BRIDGE_ENV_ID: ${{ vars.BRIDGE_ENV_ID }}

      - name: Commit reconciler events back to tickets branch
        run: |
          cd .tickets-tracker  # tickets-boundary-ok
          # Check for any changes (staged, unstaged, or untracked)
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new events to commit — skipping."
            exit 0
          fi

          # Configure bridge bot identity (not the default github-actions[bot]).
          # Values are read from env vars (set via the env: map below) rather than
          # interpolated directly into the run: block to prevent expression injection.
          git config user.name "${BRIDGE_BOT_NAME}"
          git config user.email "${BRIDGE_BOT_EMAIL}"

          git add -A
          git commit -m "chore: sync events from DSO reconciler [run ${{ github.run_id }}]"

          # Push with 5-retry fetch-rebase-push loop with exponential backoff+jitter.
          # Pattern mirrors the deleted inbound-bridge.yml (7e1c-ef09 hardening).
          max_retries=5
          attempt=0
          while [ "$attempt" -lt "$max_retries" ]; do
            attempt=$((attempt + 1))
            push_stderr=""
            push_exit=0
            push_stderr=$(git push origin HEAD:tickets 2>&1) || push_exit=$?

            if [ "$push_exit" -eq 0 ]; then
              echo "Push succeeded (attempt $attempt)."
              exit 0
            fi

            if echo "$push_stderr" | grep -qiE 'non-fast-forward|rejected|fetch first'; then
              printf 'Push rejected (attempt %d):\n%s\n' "$attempt" "$push_stderr" >&2
              fetch_exit=0
              git fetch origin tickets 2>&1 || fetch_exit=$?
              if [ "$fetch_exit" -ne 0 ]; then
                echo "Fetch failed (exit $fetch_exit) — retrying without updated remote" >&2
              fi
            else
              echo "Push failed (non-retryable, exit $push_exit): $push_stderr" >&2
              exit 1
            fi

            pre_sha=$(git rev-parse HEAD)
            rebase_exit=0
            git rebase origin/tickets 2>&1 || rebase_exit=$?
            if [ "$rebase_exit" -ne 0 ]; then
              git rebase --abort 2>/dev/null || true
              echo "Rebase conflict during push retry (attempt $attempt)" >&2
              exit 1
            fi
            post_sha=$(git rev-parse HEAD)
            if [ "$pre_sha" = "$post_sha" ] && [ "$attempt" -lt "$max_retries" ]; then
              echo "Rebase produced no progress (origin/tickets unchanged) — re-fetching before next attempt" >&2
              recovery_fetch_exit=0
              git fetch origin tickets 2>&1 || recovery_fetch_exit=$?
              if [ "$recovery_fetch_exit" -ne 0 ]; then
                echo "Recovery fetch failed (exit $recovery_fetch_exit) — proceeding with stale remote ref" >&2
              fi
              recovery_rebase_exit=0
              git rebase origin/tickets 2>&1 || recovery_rebase_exit=$?
              if [ "$recovery_rebase_exit" -ne 0 ]; then
                git rebase --abort 2>/dev/null || true
                echo "Recovery rebase conflict — sleeping before next attempt" >&2
                sleep $(( (1 << attempt) + RANDOM % 3 ))
                continue
              fi
            fi

            if [ "$attempt" -lt "$max_retries" ]; then
              backoff=$(( (1 << attempt) + RANDOM % 3 ))
              echo "Waiting ${backoff}s before retry $((attempt + 1))..." >&2
              sleep "$backoff"
            fi
          done

          echo "Push failed after $max_retries retries. Last push stderr: $push_stderr" >&2
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRIDGE_BOT_NAME: ${{ vars.BRIDGE_BOT_NAME || 'dso-bridge[bot]' }}
          BRIDGE_BOT_EMAIL: ${{ vars.BRIDGE_BOT_EMAIL || 'dso-bridge@users.noreply.github.com' }}

      - name: Job timing report
        if: always()
        run: echo "reconcile-bridge completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Notify on bridge failure
        if: failure()
        env:
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## :rotating_light: Reconcile Bridge run FAILED"
            echo ""
            echo "- **Workflow:** \`${{ github.workflow }}\`"
            echo "- **Run:** $GH_RUN_URL"
            echo "- **Run ID:** \`${{ github.run_id }}\`"
            echo "- **Triggered by:** \`${{ github.event_name }}\`"
            echo "- **Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "Ticket tracking chronic silent-failure: \`7273-997c-9c4d-4e50\`"
            echo ""
            echo "Investigate via the run link above. If this is a recurring failure, check the reconciler logs and BRIDGE_ENV_ID repo variable."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Reconcile Bridge run failed::See run summary for details; tracker ticket 7273-997c-9c4d-4e50 — $GH_RUN_URL"
