            if isinstance(d,list): print(len(d))
            elif isinstance(d,dict):
              links=d.get('issueLinks') or d.get('issuelinks') or d.get('links') or d.get('results',[])
              print(len(links))
            else: print(f'UNEXPECTED:{type(d).__name__}')
          except Exception as e: print(f'PARSE:{e}')
          " 2>/dev/null)
            echo "  link count: $LINK_COUNT"
            [[ "$LINK_COUNT" -ge 1 ]] && _pass "create + read link (Blocks)" || _fail "link: count=$LINK_COUNT"

            echo "Test 9c: Delete link"
            LINK_ID=$(echo "$LINK_DATA" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            links=d if isinstance(d,list) else d.get('issueLinks') or d.get('issuelinks') or d.get('links',[])
            if links: print(links[0].get('id',''))
          except: pass
          " 2>/dev/null)
            if [ -n "$LINK_ID" ]; then
              acli jira workitem link delete --id "$LINK_ID" 2>/dev/null
              LINKS_AFTER=$(acli jira workitem link list --key "$TEST_KEY" --json 2>/dev/null | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin); links=d if isinstance(d,list) else d.get('issueLinks') or d.get('issuelinks') or d.get('links',[]); print(len(links))
          except: print('?')
          " 2>/dev/null)
              echo "  links after delete: $LINKS_AFTER"
              [[ "$LINKS_AFTER" == "0" ]] && _pass "delete link" || _fail "delete link: $LINKS_AFTER remain"
            else _skip "delete link (no link ID)"; fi

            # Test 9d: Create "Relates" link (non-blocking)
            echo "Test 9d: Create Relates link ($TEST_KEY relates to $LINK_KEY)"
