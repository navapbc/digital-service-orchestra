          acli jira workitem edit --from-json "$LABEL_TMP" --yes 2>/dev/null
          rm -f "$LABEL_TMP"

          echo "Test 8b: Read labels via ACLI view"
          LABELS_AFTER=$(_get_issue "$TEST_KEY" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          # Try flat then nested
          labels=d.get('labels') or (d.get('fields',{}) or {}).get('labels',[])
          print(json.dumps(labels if isinstance(labels,list) else []))
          " 2>/dev/null)
          echo "  labels via view: $LABELS_AFTER"
          [[ "$LABELS_AFTER" == *"probe-test-label"* ]] && _pass "add + read label via view" || _fail "add+read label: $LABELS_AFTER"

          echo "Test 8c: Read labels via search -f"
          LABELS_SEARCH=$(acli jira workitem search --jql "key = $TEST_KEY" \
            -f "key,labels" --json 2>/dev/null | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            issues=d if isinstance(d,list) else d.get('issues',[])
            if issues:
              f=issues[0].get('fields',{}) or {}
              labels=f.get('labels') or issues[0].get('labels',[])
              print(json.dumps(labels if isinstance(labels,list) else []))
            else: print('NO_ISSUES')
          except Exception as e: print(f'ERROR:{e}')
          " 2>/dev/null)
          echo "  labels via search: $LABELS_SEARCH"
          [[ "$LABELS_SEARCH" == *"probe-test-label"* ]] && _pass "read labels via search -f" || _fail "read labels via search: $LABELS_SEARCH"

          echo "Test 8d: Remove label"
          LABEL_RM=$(mktemp /tmp/label-rm.XXXXXX.json)
          echo "{\"issues\":[\"$TEST_KEY\"],\"labelsToRemove\":[\"probe-test-label\"]}" > "$LABEL_RM"
          acli jira workitem edit --from-json "$LABEL_RM" --yes 2>/dev/null
          rm -f "$LABEL_RM"
          LABELS_REMOVED=$(_get_issue "$TEST_KEY" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          labels=d.get('labels') or (d.get('fields',{}) or {}).get('labels',[])
          print(json.dumps(labels if isinstance(labels,list) else []))
          " 2>/dev/null)
          echo "  labels after remove: $LABELS_REMOVED"
          [[ "$LABELS_REMOVED" == "[]" || "$LABELS_REMOVED" == "" ]] && _pass "remove label" || _fail "remove label: $LABELS_REMOVED"

          # =====================================================================
          echo; echo "=== PHASE 9: LINKS — create, read, delete ==="
          # =====================================================================

          if [ -n "$LINK_KEY" ]; then
            echo "Test 9a: Create link ($TEST_KEY blocks $LINK_KEY)"
